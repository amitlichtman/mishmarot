<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1E2433">
<title>DoTheShift</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DoTheShift">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Secular+One&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E2433; --paper:#F5F6F8; --line:#DCE0E8; --muted:#5F6878;
  --warn:#B4400E; --ok:#17855B;
  font-family:'Rubik',system-ui,sans-serif; color:var(--ink); background:var(--paper);
}
*{box-sizing:border-box}
body{margin:0;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;padding:12px 16px 120px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 14px}
.brand{display:flex;align-items:center;gap:10px;margin:0;font-family:'Secular One',sans-serif;font-weight:400;font-size:clamp(1.2rem,5.2vw,1.6rem);min-width:0;flex:1}
.bars{display:flex;gap:3px;align-items:flex-end;height:22px}
.bars i{display:block;width:6px;border-radius:2px}
.bars i:nth-child(1){height:12px;background:#E9A23B}
.bars i:nth-child(2){height:17px;background:#D6577A}
.bars i:nth-child(3){height:22px;background:#34478F}
.who{display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--muted)}
.who .me{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}
.who .me b{color:var(--ink);font-weight:500}
.who{flex:none}
.who .me{max-width:30vw}
.who .me b,.who .me small{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .me small{font-size:.78rem}
.link{border:0;background:none;text-decoration:underline;padding:4px;color:var(--ink)}
.demo{background:#FFF7E6;border:1px solid #F3D9A4;border-radius:10px;padding:8px 12px;font-size:.88rem;margin-bottom:12px}

/* tabs + week */
.tabs{display:flex;gap:4px;background:#E6E9EF;border-radius:10px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:7px;font-weight:500}
.tabs button[aria-current="page"]{background:#fff;box-shadow:0 1px 2px rgba(30,36,51,.14)}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 0 6px}
.weeknav h2{font-family:'Secular One',sans-serif;font-weight:400;font-size:1.3rem;margin:0;text-align:center}
.weeknav small{display:block;font-family:'Rubik';font-size:.8rem;color:var(--muted)}
.iconbtn.refresh{width:36px;height:36px;color:var(--ink)}
.iconbtn.refresh.busy svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:8px;width:42px;height:42px;font-size:1.2rem;line-height:1;flex:none;display:inline-grid;place-items:center}

h3{font-family:'Secular One',sans-serif;font-weight:400;font-size:1.15rem;margin:26px 0 6px}
.hint{color:var(--muted);margin:4px 0 10px;font-size:.92rem}
.notice{background:#EEF1F6;border-radius:10px;padding:10px 12px;margin:8px 0}
.notice.msg{background:#fff;border:1.5px solid var(--line);white-space:pre-wrap}
.empty{text-align:center;color:var(--muted);padding:40px 12px}
.loading{text-align:center;color:var(--muted);padding:60px 0}

.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--muted);margin:0 0 6px}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:16px;height:16px;border-radius:4px;display:inline-block}

/* day grid */
.grid{overflow-x:auto;padding-bottom:2px}
.day{display:grid;grid-template-columns:58px repeat(var(--n,3),minmax(76px,1fr));
  min-width:calc(58px + var(--n,3) * 82px);gap:6px;padding:7px 0;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.dlabel{display:flex;flex-direction:column;justify-content:center;position:sticky;inset-inline-start:0;z-index:2;background:var(--paper);margin-block:-7px;padding-block:7px;box-shadow:-6px 0 6px -6px rgba(30,36,51,.25)}
.dlabel b{font-weight:700}
.dlabel span{color:var(--muted);font-size:.82rem}
.off{border-radius:10px;background:repeating-linear-gradient(-45deg,#ECEEF2 0 2px,transparent 2px 9px)}

.chip{border-radius:10px;border:1.5px dashed #C5CBD6;background:#fff;padding:7px 4px;min-height:66px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:transform .08s ease}
.chip:active:not(:disabled){transform:scale(.96)}
.chip .sn{font-weight:700;font-size:.88rem}
.chip .st{font-size:.75rem}
.chip{box-shadow:inset 0 4px 0 var(--c)}
.chip.unset .st{color:var(--muted)}
.chip.set{background:color-mix(in srgb,var(--sc) 22%,#fff);border:2px solid var(--sc)}
.chip.set .st{font-weight:500}
.chip.never{background:color-mix(in srgb,var(--sc) 12%,#F3F4F7);color:var(--muted)}
.chip.never .sn{text-decoration:line-through}
.stpick{display:grid;gap:8px;margin:6px 0 4px}
.stpick button{display:flex;align-items:center;gap:10px;border:2px solid var(--sc,var(--line));background:color-mix(in srgb,var(--sc,#fff) 18%,#fff);border-radius:10px;padding:12px;font-weight:500;text-align:right}
.stpick button[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:1px}
.stpick .lv{margin-inline-start:auto;font-weight:400;font-size:.8rem;color:var(--muted)}
.statecard{background:#fff;border:1.5px solid var(--line);border-inline-start:7px solid var(--sc);border-radius:12px;padding:2px 14px 12px;margin:10px 0}
.chip:disabled{cursor:default}

.slot{border-radius:10px;border:1.5px solid var(--line);border-top:5px solid var(--c);background:#fff;
  padding:6px;min-height:72px;text-align:start;display:flex;flex-direction:column;gap:2px}
.slot .sn{display:flex;justify-content:space-between;gap:0 4px;flex-wrap:wrap;font-weight:700;font-size:.84rem}
/* באנגלית הכיוון הפוך: החצים של השבועות מתהפכים */
[dir=ltr] [data-action=week] svg{transform:scaleX(-1)}
.slot em{font-style:normal;font-weight:500}
.slot.short em{color:var(--warn)}
.slot.short{background:#FFF8F4}
.slot .names{font-size:.8rem;line-height:1.35}
.slot .names.none{color:var(--muted)}

/* buttons, status */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 10px}
.btn{border:1.5px solid var(--ink);background:#fff;border-radius:9px;padding:9px 14px;font-weight:500}
.btn.primary{background:var(--ink);color:#fff}
.btn.sm{padding:6px 10px;font-size:.85rem}
.btn.danger{border-color:var(--warn);color:var(--warn)}
.btn:disabled{opacity:.45;cursor:default}
.status{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.86rem;margin:4px 0 8px}
.pill{border-radius:99px;padding:2px 10px;background:#E6E9EF;white-space:nowrap}
.pill.ok{background:#DDF3E8;color:var(--ok)}
.pill.warn{background:#FDEDE4;color:var(--warn)}

/* forms */
.field{display:block;margin-top:12px;font-weight:500;font-size:.92rem}
.field small{display:block;font-weight:400;color:var(--muted)}
textarea,select,input[type=email],input[type=password],input[type=text],input[type=tel],input[type=number],input[type=time]{
  width:100%;margin-top:5px;border:1.5px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff}
textarea{min-height:70px;resize:vertical}
input:disabled,select:disabled{background:#F0F2F5;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row .field{flex:1;min-width:110px}
.row .grow{flex:2;min-width:150px}
.check{display:flex;gap:10px;align-items:center;margin-top:14px}
.check input{width:20px;height:20px;accent-color:var(--ink);flex:none}
.card{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:4px 14px 14px;margin:12px 0}
.card pre{white-space:pre-wrap;font:inherit;background:#F5F6F8;border-radius:8px;padding:10px;margin:12px 0}

.shiftcard{background:#fff;border:1.5px solid var(--line);border-inline-start:7px solid var(--c);border-radius:12px;padding:2px 14px 12px;margin:12px 0}
.swatches{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
.swatch{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--ink)}
.needs{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.needs label{display:flex;flex-direction:column;align-items:center;font-size:.8rem;color:var(--muted)}
.needs input{text-align:center;padding:8px 0}

/* save bar */
.savebar{position:fixed;inset-inline:0;bottom:0;background:rgba(245,246,248,.95);backdrop-filter:blur(6px);
  border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:5}
.savebar .in{max-width:780px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.savebar span{font-size:.88rem;color:var(--muted)}
.savebar span.dirty{color:var(--warn)}

/* lists */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list li.btnrow{padding:0}
.userbtn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;background:none;text-align:start;padding:11px 2px}
.sub{color:var(--muted);font-size:.84rem}
.myshift{display:flex;align-items:center;gap:10px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}

/* login */
.login{max-width:380px;margin:8vh auto 0}
.login h1{font-family:'Secular One',sans-serif;font-weight:400;font-size:2.3rem;margin:0 0 4px;display:flex;align-items:center;gap:12px}
.login p{color:var(--muted);margin-top:0}
.userpick{display:grid;gap:8px;margin-top:16px}
.userpick button{text-align:start;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:12px;display:flex;justify-content:space-between}
.userpick button span{color:var(--muted);font-size:.85rem}

/* sheet */
dialog{border:0;border-radius:14px;padding:0;width:min(480px,calc(100% - 20px));max-height:85vh}
dialog::backdrop{background:rgba(30,36,51,.45)}
.sheet{padding:0 18px 18px}
.sheet header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-top:6px solid var(--c);margin:0 -18px 6px;padding:14px 18px 0}
.sheet h2{font-family:'Secular One',sans-serif;font-weight:400;font-size:1.2rem;margin:0}
.sheet h4{margin:14px 0 4px;font-size:.85rem;color:var(--muted);font-weight:500}
.opt{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid #EEF0F3}
.opt input{width:20px;height:20px;accent-color:var(--ink);flex:none}
.opt .meta{margin-inline-start:auto;text-align:end;font-size:.78rem;color:var(--muted)}
.opt .meta .w{color:var(--warn);display:block}

.chip .hr{font-size:.68rem;opacity:.85;direction:ltr}
.slot .hr{font-size:.7rem;color:var(--muted);direction:ltr;text-align:start}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 10px}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:8px 0 6px}
.stat{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:'Secular One',sans-serif;font-weight:400;font-size:1.7rem;line-height:1.2}
.stat span{color:var(--muted);font-size:.84rem}
.tag{font-size:.75rem;border-radius:99px;padding:1px 8px;background:#E6E9EF;color:var(--muted);margin-inline-start:6px}
.month{font-weight:700;margin:16px 0 0;font-size:.95rem}
.tot{font-weight:700;border-top:2px solid var(--ink)!important}
.divider{margin:28px 0 8px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted)}
.picklist{margin-top:8px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:0 14px}
.picklist .userbtn b{font-size:1.05rem}
.poscard{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:2px 14px 12px;margin:10px 0}
.posgrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;font-weight:400}
.poschip{display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px 6px 14px;cursor:pointer}
.poschip:has(input:checked){border-color:var(--ink);background:#EEF1F6}
.poschip input{width:18px;height:18px;accent-color:var(--ink);margin:0}
.brandbtn{display:flex;align-items:center;gap:10px;border:0;background:none;padding:2px 0;font:inherit;color:inherit;text-align:start;min-width:0;max-width:100%}
.brandbtn .bars{flex:none}
.brandbtn .bn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.brandbtn .caret{font-family:'Rubik';font-size:.9rem;color:var(--muted)}
.kiosk{padding-top:4px}
.ktop{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 14px;margin-bottom:6px}
.kclock{font-family:'Secular One',sans-serif;font-size:clamp(1.1rem,4.5vw,1.6rem);color:var(--ink)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0 24px}
.kperson{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:84px;padding:14px;border:2px solid var(--line);background:#fff;border-radius:14px;text-align:right}
.kperson b{font-size:1.15rem}
.kperson span{font-size:.85rem;color:var(--muted)}
.kperson.on{border-color:var(--ok);background:#EEF8F3}
.kperson.on span{color:var(--ok);font-weight:500}
.kwarn{color:var(--warn);font-weight:500;margin:14px 0 0}
.pe-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:6px 8px;margin:12px 0}
.pe-row .pe-l{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:0 8px;align-items:baseline;font-weight:500}
.pe-row .pe-l small{font-weight:400;color:var(--muted);font-size:.8rem}
.pe-row input{width:100%;min-width:0;box-sizing:border-box}
.kdev{margin:-2px 0 8px;font-weight:500;color:var(--muted)}
.kfoot{text-align:center;padding-bottom:30px}
.kbtn{width:100%;padding:14px;font-size:1.1rem}
.kdone{text-align:center;padding:30px 18px}
.kdone .kbig{font-family:'Secular One',sans-serif;font-size:2rem;margin:0}
.kdone p{font-size:1.2rem;margin:6px 0}
.tag.bad{background:#FDEDE4;color:var(--warn)}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.crew-head{display:flex;align-items:baseline;justify-content:space-between;margin:16px 0 10px}
.crew-head h3{margin:0}.crew-head span{color:var(--muted);font-size:.9rem}
.crew-q{margin-bottom:12px}
.crew{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.crew-card{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 15%,#fff);font-size:1.05rem}
.ci{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px}
.ci b{font-size:1.02rem}
.crole{font-size:.72rem;font-weight:500;padding:1px 8px;border-radius:9px;background:var(--ink);color:#fff}
.cpos{flex-basis:100%;display:flex;flex-wrap:wrap;gap:4px}
.cpos i{font-style:normal;font-size:.75rem;padding:1px 8px;border-radius:9px;background:#EEF0F5;color:var(--muted)}
.cph{flex-basis:100%;font-size:.82rem;color:var(--muted)}
.cact{flex:none;display:flex;gap:6px}
.cib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--ink);background:#fff;text-decoration:none}
.cib:active{transform:scale(.94)}
.cib.wa{color:#17855B;border-color:color-mix(in srgb,#17855B 35%,#fff)}
.langdd{position:relative}
.langdd summary{list-style:none;cursor:pointer}
.langdd summary::-webkit-details-marker{display:none}
.langmenu{position:absolute;top:calc(100% + 8px);inset-inline-end:0;min-width:168px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 36px -14px rgba(30,36,51,.3);padding:6px;z-index:40}
.langmenu button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:0;border-radius:10px;background:none;font:500 1rem 'Rubik',sans-serif;color:var(--ink);cursor:pointer;text-align:start}
.langmenu button:hover{background:var(--paper)}
.langmenu .ck{color:var(--ok)}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:#fff;font-weight:700;font-size:.95rem;cursor:pointer;user-select:none}
.acct[open] .avatar{box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 20%,transparent)}
.mhead{display:flex;flex-direction:column;padding:8px 12px 10px;line-height:1.3}
.mhead b{font-weight:600}.mhead small{color:var(--muted);font-size:.82rem}
.helpline{text-align:center;color:var(--muted);font-size:.88rem;margin:22px 0 0}
.helpline a{color:var(--ink)}
.langmenu a.mitem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:500}
.langmenu a.mitem:hover{background:var(--paper)}
.langmenu a.mitem svg{color:var(--muted)}
.msep{height:1px;background:var(--line);margin:4px 6px}
.acct .langmenu{min-width:200px}
.acct .langmenu button svg:not(.ck){color:var(--muted)}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brandrow h1{margin:0}
.badge{display:inline-block;min-width:18px;margin-inline-start:6px;padding:0 5px;border-radius:9px;background:var(--warn);color:#fff;font-size:.72rem;font-style:normal;line-height:18px;text-align:center}
.tk{display:flex;flex-direction:column;align-items:flex-start;gap:3px;margin-top:5px;padding-top:5px;border-top:1px dashed var(--line)}
.tkn{font-size:.72rem;color:var(--warn);font-weight:500}
.btn.xs{padding:3px 8px;font-size:.74rem;border-radius:7px}
.tk .tag{font-size:.7rem;margin:0}
.reqb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end}
.list li.wrapli{flex-wrap:wrap}
.list li.wrapli .reqb{flex-basis:100%}
.reqs{margin:6px 0 14px}
button.pill{border:0;cursor:pointer;font:inherit}
.req{background:#fff;border:1px solid var(--line);border-inline-start:4px solid var(--warn);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.req>b{display:block}.req>.sub{display:block;color:var(--muted);font-size:.88rem;margin-bottom:4px}
.vol{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line);flex:1}
.vol em{font-style:normal;color:var(--muted);font-size:.82rem;margin-inline-start:4px}
.reqrow{display:flex;gap:6px;align-items:center}
#install{padding-top:10px;padding-bottom:0}
.inst{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.inst img{width:42px;height:42px;border-radius:10px;flex:none}
.inst .it{flex:1;min-width:0}
.inst .it b{display:block}
.inst .it span{font-size:.88rem;color:var(--muted)}
.inst .ib{display:flex;flex-direction:row;align-items:center;gap:6px;flex:none;margin-inline-start:auto}
.inst{flex-wrap:wrap}
.inst .it{flex:1 1 170px}
.inst .ib .btn{white-space:nowrap}
.nrow{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.nrow input{margin-top:4px}
.nrow small{display:block;color:var(--muted)}
.nstat{padding:10px 12px;border-radius:10px;background:#EEF0F5;margin:8px 0 6px;font-size:.92rem}

  if (c.includes('invalid-email')) return 'כתובת האימייל לא תקינה';

  if (c === 'no-company') return 'החשבון הזה לא משויך לאף עסק. אפשר לפתוח חשבון עסק, או לבקש ממנהל להוסיף אותך';
  if (c === 'inactive') return 'החשבון שלך לא פעיל באף עסק. פנה למנהל';
  if (c === 'push-demo') return 'במצב הדגמה אין התראות. הן עובדות באתר האמיתי';
  if (c === 'push-unsupported') return 'הדפדפן הזה לא תומך בהתראות. באייפון צריך קודם להתקין את האפליקציה במסך הבית';
  if (c === 'push-denied') return 'ההתראות חסומות. אפשר לאפשר אותן בהגדרות הדפדפן או הטלפון';
  if (c === 'not-manager') return 'רק מנהל של העסק הזה יכול להוציא את המכשיר ממצב שעון נוכחות';
  if (c === 'clock-off') return 'המכשיר הזה כבר לא שעון נוכחות. אפשר להיכנס עם החשבון שלך';
  if (c === 'inactive-here') return 'החשבון שלך לא פעיל בעסק הזה. פנה למנהל';
  if (c === 'legacy-wait') return 'המערכת עודכנה. בקש מבעל העסק להיכנס פעם אחת, ואז נסה שוב';
  if (c === 'exists-wrong-pw') return 'האימייל הזה כבר רשום. כדי לפתוח איתו עסק, הקלד את הסיסמה שלו';
  if (c === 'already-member') return 'העובד הזה כבר נמצא ברשימת העובדים של העסק';
  if (c === 'needs-login') return 'האימייל הזה רשום, אבל העובד צריך להיכנס למערכת פעם אחת לפני שאפשר לצרף אותו';
  if (c.includes('permission-denied')) return 'אין הרשאה לפעולה הזו';
  return e?.message || 'משהו השתבש, נסה שוב';
}
async function copyText(t){

/* ---------- backend: Firebase ---------- */
/* מבנה הנתונים:
   companies/{מזהה}                  העסק (ownerUid = הבעלים)
   companies/{מזהה}/members/{uid}    העובד בעסק הזה: שם, הרשאה, תפקידים, פעיל
   companies/{מזהה}/settings, weeks  ההגדרות והסידורים של העסק
   users/{uid}/companies/{מזהה}      רשימת העסקים של כל חשבון
   emails/{אימייל}                   מאיזה אימייל לאיזה חשבון, כדי לצרף עובד קיים */
async function firebaseBackend(cfg){
  const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const AppM = await import(base+'firebase-app.js');
  const A = await import(base+'firebase-auth.js');
  const F = await import(base+'firebase-firestore.js');
  const app = AppM.initializeApp(cfg), auth = A.getAuth(app), db = F.getFirestore(app);
  auth.languageCode = LANG;
  const snap = s => s.exists() ? s.data() : null;
  const now = () => F.serverTimestamp();
  let cid = null;
  const cdoc = (...p) => F.doc(db, 'companies', cid, ...p);
  const ccol = (...p) => F.collection(db, 'companies', cid, ...p);
  const memberRef = (c, u) => F.doc(db, 'companies', c, 'members', u);
  const indexRef = (u, c) => F.doc(db, 'users', u, 'companies', c);
  // אפליקציה משנית ליצירת חשבונות, כדי שהמנהל לא יתנתק. היא מחוברת לרגע כעובד החדש
  let creator = null;
  async function getCreator(){
    if (creator) return creator;
    const sec = AppM.initializeApp(cfg, 'creator');
    const ca = A.getAuth(sec);
    await A.setPersistence(ca, A.inMemoryPersistence);
    return creator = { auth:ca, db:F.getFirestore(sec) };
  }
  async function ensureEmailIndex(){
    const u = auth.currentUser; if (!u?.email) return;
    if (u.email.toLowerCase().endsWith('@' + CLOCK_DOMAIN)) return;   // חשבון של שעון נוכחות לא נרשם ברשימת האימיילים
    const e = u.email.toLowerCase(), r = F.doc(db, 'emails', e);
    const s = snap(await F.getDoc(r));
    if (s?.uid !== u.uid) await F.setDoc(r, { uid:u.uid });
  }
  async function createCompany({ restaurant, name, settings }){
    const u = auth.currentUser;
    let code = null;
    for (let i = 0; i < 10 && !code; i++) {
      const c = genCode();
      try { await F.setDoc(F.doc(db,'companies',c), { name:restaurant, ownerUid:u.uid, createdAt:now() }); code = c; }
      catch(e){ if (!String(e?.code).includes('permission-denied')) throw e; }  // המספר תפוס, מגרילים שוב
    }
    if (!code) throw new Error('לא הצלחנו לפתוח את העסק, נסה שוב');
    await F.setDoc(memberRef(code, u.uid), { name, email:(u.email||'').toLowerCase(), role:'owner', positions:[], active:true, hidden:false, joinedAt:now() });
    await F.setDoc(indexRef(u.uid, code), { name:restaurant, joinedAt:now() });
    await F.setDoc(F.doc(db,'companies',code,'settings','main'), settings);
    return code;
  }
  return {
    demo:false,
    onAuth(cb){ A.onAuthStateChanged(auth, u => cb(u ? { uid:u.uid, email:u.email } : null)); },
    setCompany(c){ cid = c; },
    async signIn(email,pw){ await A.signInWithEmailAndPassword(auth,email,pw); },
    async signOut(){ cid = null; await A.signOut(auth); },
    async sendReset(email){ await A.sendPasswordResetEmail(auth,email); },
    ensureEmailIndex,
    async signUp({ restaurant, name, email, password, settings }){
      let cred, isNew = true;
      try { cred = await A.createUserWithEmailAndPassword(auth, email, password); }
      catch(e){
        if (!String(e?.code).includes('email-already-in-use')) throw e;
        // כבר יש חשבון (למשל עובד בעסק אחר): פותחים לו עסק נוסף
        try { cred = await A.signInWithEmailAndPassword(auth, email, password); } catch { throw { code:'exists-wrong-pw' }; }
        isNew = false;
      }
      try{
        await ensureEmailIndex().catch(() => {});
        return { uid:cred.user.uid, code:await createCompany({ restaurant, name, settings }) };
      }catch(e){
        if (isNew) await A.deleteUser(cred.user).catch(() => {}); else await A.signOut(auth);
        throw e;
      }
    },
    createCompany,
    // כל העסקים של החשבון, ולכל אחד אם המשתמש עדיין פעיל בו (כל משתמש יכול לקרוא את הכרטיס של עצמו)
    async myCompanies(){
      const me = auth.currentUser.uid;
      const q = await F.getDocs(F.collection(db, 'users', me, 'companies'));
      return Promise.all(q.docs.map(async d => {
        let m = null; try { m = snap(await F.getDoc(memberRef(d.id, me))); } catch {}
        return { cid:d.id, name:d.data().name || '', active:!!m && m.active !== false, role:m?.role };
      }));
    },
    async companyName(c){ try { return snap(await F.getDoc(F.doc(db,'companies',c,'settings','main')))?.business || null; } catch { return null; } },
    async getMember(uid){ return snap(await F.getDoc(memberRef(cid, uid))); },
    async getCompany(){ return snap(await F.getDoc(F.doc(db,'companies',cid))); },
    // שם העסק בפרטי החברה, כדי שיתאים לשם בהגדרות
    async setCompanyName(n){ await F.setDoc(F.doc(db,'companies',cid), { name:n }, { merge:true }); },
    // השם החדש גם ברשימת העסקים של כל עובד בעסק (users/{uid}/companies/{עסק})
    async renameInLists(uids, n){
      for (let i = 0; i < uids.length; i += 400) {
        const b = F.writeBatch(db);
        uids.slice(i, i + 400).forEach(u => b.set(indexRef(u, cid), { name:n }, { merge:true }));
        await b.commit();
      }
    },
    // תיקון של השם ברשימה שלי, אם השתנה לפני העדכון הזה
    async fixMyListName(c, n){ await F.updateDoc(indexRef(auth.currentUser.uid, c), { name:n }); },
    async listUsers(){ const q = await F.getDocs(ccol('members')); return q.docs.map(d => ({ uid:d.id, ...d.data() })); },
    // עובד רגיל: רק מי שלא סומן כחסוי (השרת מאשר רק את השאילתה הזו)
    async listVisibleUsers(){ const q = await F.getDocs(F.query(ccol('members'), F.where('hidden', '==', false))); return q.docs.map(d => ({ uid:d.id, ...d.data() })); },
    async addUser(data, companyName){
      const { password, ...doc } = data;
      let uid, existing = false;
      const cr = await getCreator();
      try {
        const cred = await A.createUserWithEmailAndPassword(cr.auth, doc.email, password);
        uid = cred.user.uid;
        await F.setDoc(F.doc(cr.db, 'emails', doc.email), { uid }).catch(e => console.warn(e));
        await A.signOut(cr.auth);
      } catch(e){
        if (!String(e?.code).includes('email-already-in-use')) throw e;
        // החשבון כבר קיים: מצרפים אותו לעסק, והסיסמה שלו לא משתנה
        const m = snap(await F.getDoc(F.doc(db, 'emails', doc.email)));
        if (!m?.uid) throw { code:'needs-login' };
        uid = m.uid; existing = true;
      }
      if (snap(await F.getDoc(memberRef(cid, uid)))) throw { code:'already-member' };
      const b = F.writeBatch(db);
      b.set(memberRef(cid, uid), { hidden:false, ...doc, active:true, joinedAt:now() });
      b.set(indexRef(uid, cid), { name:companyName || '', joinedAt:now() });
      await b.commit();
      return { uid, existing };
    },
    async updateUser(uid,data){ await F.setDoc(memberRef(cid, uid), data, { merge:true }); },
    // שלושת השינויים נשמרים יחד או לא נשמרים בכלל, כך שתמיד יש בעלים אחד
    async transferOwnership(newUid){
      const b = F.writeBatch(db);
      b.update(F.doc(db,'companies',cid), { ownerUid:newUid });
      b.update(memberRef(cid, newUid), { role:'owner' });
      b.update(memberRef(cid, auth.currentUser.uid), { role:'manager' });

/* שיבוץ: מה מונע מעובד לקחת משמרת */
function span(k){
  const [d,id] = k.split('_'), s = shiftById(id);

  const rest = parseInt(st.minRest) || 0;
  { const sp = span(k); if (mine.some(x => { const o = span(x); return Math.max(sp[0]-o[1], o[0]-sp[1]) < rest*60; })) out.push(rest > 0 ? 'rest' : 'overlap'); }

/* שיבוץ אוטומטי: מחפש את הסידור הטוב ביותר.
   סדר החשיבות: 1) כמה שיותר משבצות מאוישות 2) העדפות העובדים 3) חלוקה הוגנת של שעות.
   בונה הרבה סידורים עם קצת אקראיות, משפר כל אחד במהלכים קטנים (הוספה, החלפה, החלפה בין שניים,
   ושרשרת שמפנה מקום למשבצת חסרה), ושומר את הטוב ביותר. רץ כולו במכשיר, בתוך זמן קצוב. */
function autoAssign(opts = {}){

  const maxOf = E.map(u => (u.maxShifts ?? '') !== '' ? +u.maxShifts : (parseInt(st.maxPerWeek) || 0));
  const rk = ks.map(() => new Map());                       // לכל משבצת: עובד -> דרגת העדפה (0 גבוהה, 1 רגיל, 2 נמוכה)
  const cand = ks.map((k,i) => { const s = shiftById(k.split('_')[1]); const out = [];
    E.forEach((u,w) => { const v = S.subs[u.uid]?.avail?.[k]; if (canWork(u,s) && assignable(v)) { out.push(w); rk[i].set(w, Math.min(rankOf(v), 2)); } });
    return out; });
  const clash = (i,j) => (oneDay && day[i] === day[j]) || Math.max(sp[i][0]-sp[j][1], sp[j][0]-sp[i][1]) < rest;
  const PREF = 1e6, FILL = 1e10;
  let seed = 20261117; const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  const shuffle = arr => { for (let i = arr.length-1; i > 0; i--) { const j = Math.floor(rnd()*(i+1)); [arr[i],arr[j]] = [arr[j],arr[i]]; } return arr; };

  // מצב: a[i] = רשימת עובדים, mine[w] = המשבצות של העובד, H[w] = שעות
  let a, mine, H;
  const reset = () => { a = ks.map(() => []); mine = E.map(() => new Set()); H = E.map(() => 0); };
  const fits = (w,i,skip = -1) => {

  const score = () => { let s = 0; a.forEach((l,i) => l.forEach(w => { s += FILL - rk[i].get(w)*PREF; })); H.forEach(h => s -= h*h); return s; };

    for (const i of order) {
      const list = cand[i].filter(w => fits(w,i)).map(w => [w, rk[i].get(w)*1000 + H[w] + rnd()*3]).sort((x,y) => x[1]-y[1]);

    for (const w of shuffle(cand[i].slice())) if (fits(w,i)) { add(w,i); return true; }
    if (!depth) return false;
    for (const w of cand[i]) {
      if (a[i].includes(w)) continue;
      for (const j of [...mine[w]]) {
        if (seen.has(j) || !fits(w,i,j)) continue;
        del(w,j); add(w,i); seen.add(j);
        if (fillHole(j, depth-1, seen)) return true;
        seen.delete(j); del(w,i); add(w,j);
      }
    }
    return false;
  }
  function improve(deadline){
    let better = true;
    while (better && performance.now() < deadline) {
      better = false;
      for (let i = 0; i < n; i++) while (a[i].length < need[i] && fillHole(i, 3, new Set([i]))) better = true;
      for (let i = 0; i < n; i++) for (const w of [...a[i]]) {          // החלפה: מישהו אחר במקום w
        for (const v of cand[i]) {
          if (v === w || !fits(v,i)) continue;
          const d = (rk[i].get(w) - rk[i].get(v))*PREF - fairD(v, hr[i]) - fairD(w, -hr[i]);
          if (d > 1e-6) { del(w,i); add(v,i); better = true; break; }
        }
      }
      for (let i = 0; i < n; i++) for (let j = i+1; j < n; j++) {     // החלפה בין שני עובדים בשתי משבצות
        for (const w of [...a[i]]) for (const v of [...a[j]]) {
          if (w === v || !a[i].includes(w) || !a[j].includes(v)) continue;
          if (!rk[j].has(w) || !rk[i].has(v) || !fits(w,j,i) || !fits(v,i,j)) continue;
          const dh = hr[j]-hr[i];
          const d = (rk[i].get(w) + rk[j].get(v) - rk[j].get(w) - rk[i].get(v))*PREF - fairD(w, dh) - fairD(v, -dh);
          if (d > 1e-6) { del(w,i); del(v,j); add(w,j); add(v,i); better = true; }
        }
      }
    }
  }
  const t0 = performance.now(), budget = opts.ms ?? 600, maxRuns = opts.runs ?? 300;
  let best = null, bestS = -Infinity;
  for (let r = 0; r < maxRuns && performance.now() - t0 < budget; r++) {
    build(); improve(t0 + budget + 200);
    const s = score(); if (s > bestS) { bestS = s; best = a.map(l => l.slice()); }
  }
  const out = Object.fromEntries(ks.map((k,i) => [k, (best?.[i] || []).map(w => E[w].uid)]));
  // משבצות שנשארו חסרות, וכמה עובדים בכלל היו זמינים ומתאימים להן
  const short = ks.map((k,i) => ({ k, got:out[k].length, need:need[i], avail:cand[i].length })).filter(x => x.got < x.need);
  return { a:out, short };
}

async function loadWeek(){
  S.loading = true; render();
  try{
    if (isMgr()) S.week = await B.getWeek(wid());
    else {
      const [st, v] = await Promise.all([B.getWeekStatus(wid()), B.getMyView(wid(), S.user.uid)]);
      S.week = { ...st, ...(v?.published ? v : {}) };
    }
    S.msgDraft = S.week.message || '';
    S.reqs = S.week.published ? await B.listRequests(wid()).catch(() => []) : [];
    S.myReqs = S.week.published && !isMgr() ? await B.listMyRequests(wid(), S.user.uid).catch(() => []) : [];
    if (isMgr()) { S.subs = await B.listSubmissions(wid()); if (S.view === 'user') loadDraftFor(S.editUid); }
    else {
      S.mySub = await B.getSubmission(wid(), S.user.uid);
      S.draft = { ...(S.mySub?.avail || {}) }; S.note = S.mySub?.note || ''; S.dirty = false;

function loadDraftFor(uid){ const s = S.subs[uid]; S.draft = { ...(s?.avail || {}) }; S.note = s?.note || ''; S.dirty = false; }
async function afterLogin(){
  const fresh = S.freshLogin; S.freshLogin = false;
  B.ensureEmailIndex().catch(() => {});
  if (!B.demo) B.getLang().then(l => { if (l !== LANG) return B.setLang(LANG); }).catch(() => {});
  let all = await B.myCompanies();
  if (!all.length) {
    const m = await B.migrateLegacy().catch(() => ({ list:[] }));
    all = m.list.map(c => ({ ...c, active:true }));
    if (!all.length) { toast(errMsg({ code: m.legacy ? 'legacy-wait' : 'no-company' })); await B.signOut(); return; }
  }
  // עסקים שבהם סימנו את המשתמש כלא פעיל לא מופיעים בכלל
  const list = all.filter(c => c.active);
  if (!list.length) { toast(errMsg({ code: all.some(c => c.role === 'kiosk') ? 'clock-off' : 'inactive' })); await B.signOut(); return; }
  S.companies = list;
  // אחרי כניסה עם סיסמה: מי שפעיל בכמה עסקים בוחר מהרשימה
  if (fresh && list.length > 1) { S.picking = true; S.pickNew = false; render(); refreshNames(); return; }
  // פתיחה רגילה: העסק האחרון במכשיר הזה, ואם הוא לא זמין, הבא בתור
  const last = store.get('lastCompany:' + S.user.uid);
  const order = [...list].sort((a,b) => (b.cid === last) - (a.cid === last));
  for (const c of order) if (await enterCompany(c.cid)) return;
  toast(errMsg({ code:'inactive' })); await B.signOut();
}
async function refreshNames(){
  const listed = {};
  try {
    const fresh = await B.myCompanies(); fresh.forEach(c => listed[c.cid] = c.name);
    S.companies = fresh.filter(c => c.active || c.cid === S.cid).map(c => ({ ...c, name:S.companies.find(x => x.cid === c.cid)?.name || c.name }));
  } catch {}
  await Promise.all(S.companies.map(async c => {
    const n = await B.companyName(c.cid); if (!n) return;
    c.name = n;
    // השם ברשימה שלי ישן? מתקנים, כדי שבפעם הבאה יופיע נכון מההתחלה
    if (c.cid in listed && listed[c.cid] !== n) B.fixMyListName(c.cid, n).catch(() => {});
  }));
  if (S.picking) render(); else if (S.sheetMode === 'switch') renderSwitch();
}
async function enterCompany(cid){
  B.setCompany(cid);
  let p = null; try { p = await B.getMember(S.user.uid); } catch {}
  if (!p || p.active === false) { if (S.cid) B.setCompany(S.cid); return false; }
  S.cid = cid; S.profile = { ...p, uid:S.user.uid };
  if (p.role === 'kiosk') { await enterClock(); return true; }
  store.set('lastCompany:' + S.user.uid, cid);
  S.settings = normSettings(await B.getSettings());
  if (isMgrRole(p.role)) {
    const everyone = await B.listUsers();
    S.users = everyone.filter(u => u.role !== 'kiosk');      // מכשירי שעון הם לא עובדים
    S.clocks = everyone.filter(u => u.role === 'kiosk');
    // כרטיסים ישנים בלי השדה "חסוי": משלימים, כי לפיו השרת מחליט מה עובדים רואים
    for (const u of everyone) if (u.role !== 'kiosk' && u.hidden === undefined) { u.hidden = false; B.updateUser(u.uid, { hidden:false }).catch(e => console.warn(e)); }
  } else {
    // עובד: השמות של כולם (בשביל הסידור), ופרטים רק של מי שמותר לו לראות
    const nm = await B.getNames().catch(() => null) || {};
    const full = ST().teamVisible ? await B.listVisibleUsers().catch(() => []) : [];
    S.users = Object.entries(nm.names || {}).filter(([uid]) => uid !== S.user.uid && !full.some(u => u.uid === uid)).map(([uid, name]) => ({ uid, name, active:true, nameOnly:true }));
    S.users.push(...full.filter(u => u.uid !== S.user.uid && u.role !== 'kiosk'), { ...p, uid:S.user.uid });
    S.clocks = Object.entries(nm.clocks || {}).map(([uid, name]) => ({ uid, name, role:'kiosk' }));
  }
  S.clockSig = null; S.namesSig = null;
  Object.assign(S, { subs:{}, week:{}, allWeeks:null, repUid:null, editUid:null, draft:{}, note:'', dirty:false, sDirty:false, mySub:null });
  const c = S.companies.find(x => x.cid === cid); if (c) c.name = ST().business;
  S.view = isMgr() ? 'manage' : 'submit';
  if (isMgr()) { syncClockList().catch(e => console.warn(e)); syncNames().catch(e => console.warn(e)); }
  if (!B.demo && typeof Notification !== 'undefined' && Notification.permission === 'granted') B.enablePush().then(t => S.pushToken = t).catch(e => console.warn(e));
  if (isMgr()) B.getCompany().then(c => { if (c && c.name !== ST().business) return B.setCompanyName(ST().business); }).catch(e => console.warn(e));
  if (isMgr() && !ST().viewsVersion) {
    resyncPublished(true).then(async () => {
      const st = { ...clone(S.settings), viewsVersion:1 };
      const status = (await B.listWeeks()).filter(w => w.locked);
      for (const w of status) await B.setWeekStatus(w.id, { locked:true });
      await B.saveSettings(st); S.settings = normSettings(st);
    }).catch(e => console.warn(e));
  }
  await loadWeek();
  return true;
}

const fillState = () => states().find(x => x.level === 'normal') || states().find(x => x.level !== 'never');

/* ---------- מסירת משמרות ומשמרות חסרות ---------- */
const slotStart = k => new Date(S.weekStart.getTime() + span(k)[0] * 60e3);
const slotLabel = k => { const [d,id] = k.split('_'), sh = shiftById(id); return `יום ${DAYS[d]} ${fmt(addDays(S.weekStart,+d))} · ${esc(sh?.name || '')} ${ltr(sh ? hrs(sh) : '')}`; };
const future = k => !!shiftById(k.split('_')[1]) && slotStart(k) > new Date();
/* מה העובד יכול לבקש השבוע: משמרות שאחרים מוסרים, ומשמרות שחסרים בהן אנשים */
function offersFor(){
  const a = asg(), me = S.profile, uid = S.user.uid;
  const why = k => { const c = conflicts(me, k, a); return c.length ? WARN[c[0]] : ''; };
  const gives = S.reqs.filter(r => ST().allowGive !== false && r.type === 'give' && r.by !== uid && future(r.k) && !a[r.k]?.includes(uid) && canWork(me, shiftById(r.k.split('_')[1])))
    .map(r => ({ kind:'give', r, k:r.k, why:why(r.k), mine:r.vols?.includes(uid) }));
  const takes = keys().filter(k => ST().allowTake !== false && future(k) && a[k].length < needOf(k) && !a[k].includes(uid) && canWork(me, shiftById(k.split('_')[1])))
    .map(k => ({ kind:'take', k, why:why(k), r:S.reqs.find(r => r.type === 'take' && r.by === uid && r.k === k),
      no:S.myReqs.some(r => r.type === 'take' && r.k === k && r.status === 'rejected') }));
  return [...gives, ...takes].sort((x,y) => slotStart(x.k) - slotStart(y.k));
}
function offersHtml(){
  const list = offersFor().filter(o => o.kind === 'give');
  if (!list.length) return `<p class="empty">אין כרגע משמרות שעובדים רוצים למסור.<br>משמרות שחסרים בהן אנשים מופיעות בסידור עצמו.</p>`;
  return `<p class="hint">משמרות שעובדים אחרים רוצים למסור, ומתאימות לך.</p><ul class="list">${list.map(o => {
    const done = o.kind === 'give' ? o.mine : !!o.r;
    const sub = o.kind === 'give' ? `${esc(nameOf(o.r.by))} רוצה למסור את המשמרת` : `חסרים ${needOf(o.k) - asg()[o.k].length} במשמרת`;
    const btn = done
      ? `<span class="tag">ביקשת · ממתין למנהל</span><button class="btn sm" data-action="${o.kind === 'give' ? 'reqUnvol' : 'reqCancel'}" data-id="${o.r.id}">ביטול</button>`
      : o.why ? `<span class="tag bad">${o.why}</span>`
      : o.kind === 'give' ? `<button class="btn sm primary" data-action="reqVol" data-id="${o.r.id}">אני רוצה</button>`
      : `<button class="btn sm primary" data-action="reqTake" data-k="${o.k}">אני רוצה</button>`;
    return `<li><span><b>${slotLabel(o.k)}</b><span class="sub" style="display:block">${sub}</span></span><span class="reqb">${btn}</span></li>`; }).join('')}</ul>`;
}
/* מספר הבקשות: כל מסירה היא בקשה, וכל משמרת חסרה שמבקשים להיכנס אליה היא בקשה אחת */
const gives_slots = () => { const o = S.reqs.filter(r => r.status === 'open'); return o.filter(r => r.type === 'give').length + new Set(o.filter(r => r.type === 'take').map(r => r.k)).size; };
/* מנהל: בקשות ממתינות לשבוע המוצג */
function requestsHtml(){
  const a = asg(), open = S.reqs.filter(r => r.status === 'open'); if (!open.length) return '';
  const gives = open.filter(r => r.type === 'give'), slots = [...new Set(open.filter(r => r.type === 'take').map(r => r.k))];
  const cand = (uid, k, id, a2) => { const u = S.users.find(x => x.uid === uid); if (!u) return '';
    const w = [...(canWork(u, shiftById(k.split('_')[1])) ? [] : ['תפקיד לא מתאים']), ...conflicts(u, k, a2).map(c => WARN[c])];
    if (!future(k)) return `<div class="vol"><span>${esc(u.name)}</span></div>`;
    return `<div class="vol"><span>${esc(u.name)} <em>${keys().filter(x => a[x].includes(uid)).length} משמרות השבוע</em>${w.map(x => `<span class="tag bad">${x}</span>`).join('')}</span>
      <button class="btn sm primary" data-action="reqApprove" data-id="${id}" data-uid="${uid}">אישור</button></div>`; };
  return `<div class="reqs">
    ${gives.map(r => { const a2 = { ...a, [r.k]:(a[r.k] || []).filter(x => x !== r.by) };
      return `<div class="req"><b>${slotLabel(r.k)}</b><span class="sub">${esc(nameOf(r.by))} רוצה למסור את המשמרת</span>${future(r.k) ? '' : '<span class="tag bad">המשמרת כבר התחילה. אפשר רק לדחות</span>'}
        ${(r.vols || []).map(v => cand(v, r.k, r.id, a2)).join('') || '<p class="hint" style="margin:6px 0">עוד אין מתנדבים.</p>'}
        <button class="btn sm" data-action="reqReject" data-id="${r.id}">דחיית הבקשה</button></div>`; }).join('')}
    ${slots.map(k => { const rs = open.filter(r => r.type === 'take' && r.k === k), left = needOf(k) - (a[k] || []).length;
      return `<div class="req"><b>${slotLabel(k)}</b><span class="sub">${left > 0 ? `חסרים ${left}` : 'המשמרת כבר מלאה'} · עובדים שמבקשים להיכנס</span>${future(k) ? '' : '<span class="tag bad">המשמרת כבר התחילה. אפשר רק לדחות</span>'}
        ${rs.map(r => `<div class="reqrow">${cand(r.by, k, r.id, a)}<button class="btn sm" data-action="reqReject" data-id="${r.id}">דחייה</button></div>`).join('')}</div>`; }).join('')}
  </div>`;
}

/* בתוך משבצת של משמרת חסרה: "אני רוצה", או סטטוס הבקשה */
function takeCell(k, takes){
  const o = takes.find(x => x.k === k); if (!o) return '';
  const left = needOf(k) - asg()[k].length;
  return `<span class="tk"><span class="tkn">חסרים ${left}</span>${o.r
    ? `<span class="tag">ביקשת</span><button class="btn xs" data-action="reqCancel" data-id="${o.r.id}">ביטול</button>`
    : o.no ? `<span class="tag bad">המנהל דחה</span>`
    : o.why ? `<span class="tag bad">${o.why}</span>`
    : `<button class="btn xs primary" data-action="reqTake" data-k="${k}">אני רוצה</button>`}</span>`;
}

function viewMine(){
  if (!S.week.published) return `<p class="empty">הסידור לשבוע הזה עוד לא פורסם.<br>אפשר בינתיים להגיש זמינות בלשונית "זמינות".</p>`;
  const a = asg(), uid = S.user.uid;
  const mine = keys().filter(k => a[k].includes(uid));
  const offers = offersFor(), takes = offers.filter(o => o.kind === 'take');
  const nGive = offers.filter(o => o.kind === 'give' && !o.why && !o.mine).length;
  const seg = `<div class="seg"><button data-action="mineMode" data-m="sched" aria-pressed="${S.mineMode !== 'offers'}">הסידור</button>
    <button data-action="mineMode" data-m="offers" aria-pressed="${S.mineMode === 'offers'}">משמרות למסירה${nGive ? `<i class="badge">${nGive}</i>` : ''}</button></div>`;
  const segOn = ST().allowGive !== false;
  if (S.mineMode === 'offers' && segOn) return seg + offersHtml();
  return `${segOn ? seg : ''}
    ${S.week.message ? `<p class="notice msg">${esc(S.week.message)}</p>` : ''}
    <h3>המשמרות שלך</h3>
    ${mine.length ? `<ul class="list">${mine.map(k => { const [d,id] = k.split('_'), s = shiftById(id);
      const g = S.reqs.find(r => r.type === 'give' && r.by === uid && r.k === k), gNo = S.myReqs.some(r => r.type === 'give' && r.k === k && r.status === 'rejected');
      const act = g ? `<span class="reqb"><span class="tag">מסרת · ${(g.vols || []).length} מתנדבים · ממתין למנהל</span><button class="btn sm" data-action="reqCancel" data-id="${g.id}">ביטול</button></span>`
        : gNo ? `<span class="reqb"><span class="tag bad">המנהל דחה את המסירה</span></span>`
        : future(k) && ST().allowGive !== false ? `<span class="reqb"><button class="btn sm" data-action="reqGive" data-k="${k}">למסור</button></span>` : '';
      return `<li class="wrapli"><span class="myshift"><i class="dot" style="--c:${s.color}"></i><b>יום ${DAYS[d]} ${fmt(addDays(S.weekStart,+d))}</b></span><span>${esc(s.name)}, ${ltr(hrs(s))}</span>${act}</li>`; }).join('')}</ul>`

    ${dayGrid((d,s,k) => { const n = a[k];
      const tk = takeCell(k, takes);
      return `<div class="slot ${tk ? 'short' : ''}" style="--c:${s.color}"><span class="sn">${esc(s.name)}</span><span class="hr">${hrs(s)}</span>
        <span class="names ${n.length?'':'none'}">${n.length ? n.map(u => u===uid ? `<b>${esc(nameOf(u))}</b>` : esc(nameOf(u))).join('<br>') : 'אין שיבוץ'}</span>${tk}</div>`; },
      ST().shifts.filter(s => canSee(S.profile, s) || mine.some(k => k.endsWith('_' + s.id))))}`;
}

function viewManage(){
  const a = asg(), E = workers(), dl = deadline();
  const submitted = E.filter(u => S.subs[u.uid]).length;
  const short = keys().filter(k => a[k].length < needOf(k)).length;
  const closed = S.week.locked || (dl && Date.now() >= dl);
  const nReq = gives_slots();
  const seg = `<div class="seg"><button data-action="mgrMode" data-m="sched" aria-pressed="${S.mgrMode !== 'reqs'}">שיבוץ</button>
    <button data-action="mgrMode" data-m="reqs" aria-pressed="${S.mgrMode === 'reqs'}">בקשות ממתינות${nReq ? `<i class="badge">${nReq}</i>` : ''}</button></div>`;
  if (S.mgrMode === 'reqs') return seg + (requestsHtml() || `<p class="empty">${S.week.published ? 'אין בקשות ממתינות לשבוע הזה.' : 'הסידור לשבוע הזה עוד לא פורסם, אז עובדים לא יכולים לשלוח בקשות.'}</p>`);
  return `${seg}
    <div class="status">
      <span class="pill ${submitted===E.length?'ok':''}">${submitted} מתוך ${E.length} הגישו</span>
      <span class="pill ${closed?'warn':''}">${S.week.locked ? 'ההגשה נסגרה ידנית' : (dl && Date.now() >= dl) ? 'מועד ההגשה עבר' : dl ? `הגשה עד ${fmt(dl)} ${ltr(hhmm(dl))}` : 'ההגשה פתוחה'}</span>
      <span class="pill ${S.week.published?'ok':''}">${S.week.published ? 'הסידור פורסם' : 'טיוטה'}</span>
      ${short ? `<span class="pill warn">${short} משמרות חסרות</span>` : ''}
      ${nReq ? `<button class="pill warn" data-action="mgrMode" data-m="reqs">${nReq} בקשות ממתינות</button>` : ''}
    </div>
    <div class="toolbar">
      <button class="btn" data-action="lock">${S.week.locked ? 'פתיחת ההגשה' : 'סגירת ההגשה'}</button>
      <button class="btn" data-action="auto">שיבוץ אוטומטי</button>
      <button class="btn primary" data-action="publish">${S.week.published ? 'ביטול פרסום' : 'פרסום הסידור'}</button>
    </div>
    <p class="hint">לוחצים על משמרת כדי לראות מי זמין ולשבץ.</p>
    ${dayGrid((d,s,k) => { const n = a[k], need = needOf(k);
      return `<button class="slot ${n.length<need?'short':''}" style="--c:${s.color}" data-action="openSlot" data-k="${k}"
        aria-label="משמרת ${esc(s.name)} ביום ${DAYS[d]}, ${n.length} מתוך ${need} משובצים">
        <span class="sn">${esc(s.name)}<em>${n.length}/${need}</em></span>
        <span class="names ${n.length?'':'none'}">${n.length ? n.map(u => esc(nameOf(u))).join('<br>') : 'אין שיבוץ'}</span></button>`; })}
    <div class="noprint">
      <h3>הודעה לעובדים</h3>
      <p class="hint">מופיעה לעובדים מעל הסידור, ובטקסט לוואטסאפ.</p>
      <textarea id="weekMsg" placeholder="למשל: ביום שישי סוגרים מוקדם">${esc(S.msgDraft)}</textarea>
      <div class="toolbar"><button class="btn sm" data-action="saveMsg">שמירת הודעה</button></div>
      <h3>עוד פעולות</h3>
      <div class="toolbar">
        <button class="btn sm" data-action="shareWa">שליחה בוואטסאפ</button>
        <button class="btn sm" data-action="copySched">העתקת הסידור כטקסט</button>
        <button class="btn sm" data-action="print">הדפסה</button>
        <button class="btn sm" data-action="copyPrev">העתקת השיבוץ מהשבוע הקודם</button>
        <button class="btn sm danger" data-action="clearAsg">ניקוי השיבוץ</button>
        <button class="btn sm" data-action="kioskOn">שעון נוכחות</button>
      </div>
    </div>`;
}

function viewTeam(){
  const a = asg(), all = [...S.users].sort(byName);
  const active = all.filter(u => u.active !== false), inactive = all.filter(u => u.active === false);
  const W = workers(), submitted = W.filter(u => S.subs[u.uid]).length;
  const row = u => {
    const sub = S.subs[u.uid], n = keys().filter(k => a[k].includes(u.uid)).length;
    const isW = isWorker(u);
    const pos = userPos(u).map(posName);
    const info = [u.role !== 'employee' ? ROLE_LABEL[u.role] : null, u.hidden ? 'חסוי' : null, pos.length ? pos.join(' ו') : null,
      isW ? (sub ? `הגיש, משובץ ל-${n}` : 'עוד לא הגיש') : null].filter(Boolean).join(', ');
    return `<li class="btnrow"><button class="userbtn" data-action="openUser" data-uid="${u.uid}">
      <span><b>${esc(u.name)}</b><span class="sub" style="display:block">${info || 'לא משתבץ'}</span>${sub?.note ? `<span class="sub" style="display:block">"${esc(sub.note)}"</span>` : ''}</span>
      ${isW ? `<span class="pill ${sub?'ok':'warn'}">${sub?'הגיש':'חסר'}</span>` : ''}</button></li>`;
  };
  return `
    <div class="status"><span class="pill ${submitted===W.length?'ok':''}">${submitted} מתוך ${W.length} הגישו לשבוע הזה</span></div>
    <div class="toolbar"><button class="btn primary" data-action="newUser">הוספת עובד</button><button class="btn" data-action="kioskOn">שעון נוכחות</button></div>
    <ul class="list">${active.map(row).join('')}</ul>
    ${inactive.length ? `<h3>לא פעילים</h3><ul class="list">${inactive.map(row).join('')}</ul>` : ''}
    ${S.clocks.length ? `<h3>מכשירי שעון נוכחות</h3><ul class="list">${[...S.clocks].sort((a,b) => (b.active !== false) - (a.active !== false)).map(c => `<li>
      <span><b>${esc(c.name)}</b><span class="sub" style="display:block">${c.active !== false ? 'פעיל' : 'הושבת'}</span></span>
      ${c.active !== false ? `<button class="btn sm danger" data-action="clockOff" data-uid="${c.uid}">השבתה</button>` : ''}</li>`).join('')}</ul>
      <p class="hint">אפשר להוציא מכשיר ממצב שעון במכשיר עצמו (עם אימייל וסיסמה של מנהל), או להשבית אותו כאן. ההשבתה סופית: המכשיר מתנתק תוך שעה לכל היותר, או מיד כשמרעננים בו את הדף או כשמישהו מנסה להחתים בו.</p>` : ''}`;
}

function userFields(isNew){
  const u = S.uDraft;
  return `
    <label class="field">שם<input type="text" data-u="name" value="${esc(u.name)}"></label>
    <label class="field">אימייל${isNew ? '' : '<small>אי אפשר לשנות אימייל של משתמש קיים</small>'}
      <input type="email" dir="ltr" data-u="email" value="${esc(u.email)}" ${isNew?'':'disabled'}></label>
    ${isNew ? `<div class="row"><label class="field grow">סיסמה ראשונית<small>אם העובד כבר רשום במערכת, הוא ממשיך עם הסיסמה שלו</small><input type="text" dir="ltr" data-u="password" value="${esc(u.password)}"></label>
      <button class="btn sm" data-action="genPw" style="margin-bottom:2px">סיסמה חדשה</button></div>` : ''}
    <label class="field">טלפון<small>לשליחת פרטים בוואטסאפ</small><input type="tel" dir="ltr" data-u="phone" value="${esc(u.phone)}"></label>
    <div class="row">
      ${accessField(u, isNew)}
      <label class="field">מקסימום משמרות בשבוע<small>ריק = לפי ההגדרות (${ST().maxPerWeek || 'ללא'})</small>
        <input type="number" min="0" inputmode="numeric" data-u="maxShifts" value="${esc(u.maxShifts ?? '')}"></label>
    </div>
    <div class="field">תפקידים בעסק<small>${isMgrRole(u.role) ? 'מנהל עם תפקיד משתבץ למשמרות. בלי תפקיד הוא רק מנהל.' : 'משמרות שמוגדרות לתפקיד מסוים יופיעו רק למי שיש לו אותו.'}</small>
      <div class="posgrid">${positions().map(p => `<label class="poschip"><input type="checkbox" data-action="userPos" data-id="${p.id}" ${(u.positions||[]).includes(p.id)?'checked':''}>${esc(p.name)}</label>`).join('')
        || '<span class="sub">עוד אין תפקידים. מוסיפים אותם בהגדרות.</span>'}</div></div>
    <label class="check"><input type="checkbox" data-u="hidden" ${u.hidden?'checked':''}>חסוי: עובדים לא יראו אותו ברשימת הצוות (השם שלו עדיין יופיע בסידור)</label>
    ${isNew ? '' : lockedSelf(u) ? '' : `<label class="check"><input type="checkbox" data-u="active" ${u.active!==false?'checked':''}>פעיל (משתמש לא פעיל לא יכול להיכנס)</label>`}`;
}
/* בעלים ואתה עצמך: אי אפשר לשנות הרשאה או להשבית */
const lockedSelf = u => u.role === 'owner' || u.uid === S.user?.uid;
function accessField(u, isNew){
  if (!isNew && lockedSelf(u)) {
    const why = u.role === 'owner' ? (u.uid === S.user?.uid ? 'אתה הבעלים. אפשר להעביר את הבעלות מהכרטיס של משתמש אחר' : 'אי אפשר לשנות את ההרשאה של הבעלים') : 'אי אפשר לשנות את ההרשאה של עצמך';
    return `<div class="field">הרשאה<small>${why}</small><input type="text" value="${ROLE_LABEL[u.role]}" disabled></div>`;
  }
  return `<label class="field">הרשאה<select data-u="role">
        <option value="employee" ${u.role!=='manager'?'selected':''}>עובד</option>
        <option value="manager" ${u.role==='manager'?'selected':''}>מנהל</option></select></label>`;
}

function viewUser(){
  const u = S.users.find(x => x.uid === S.editUid); if (!u) return `<p class="empty">העובד לא נמצא.</p>`;
  const a = asg(), mine = keys().filter(k => a[k].includes(u.uid));
  const isW = isWorker(u);
  return `
    <div class="toolbar"><button class="btn sm" data-action="tab" data-v="team">חזרה לעובדים</button></div>
    <div class="card"><h3>${esc(u.name)}</h3>
      ${userFields(false)}
      <div class="toolbar" style="margin-top:16px">
        <button class="btn primary" data-action="saveUser">שמירת פרטים</button>
        <button class="btn" data-action="resetPw">שליחת מייל לאיפוס סיסמה</button>
        ${u.phone ? `<button class="btn" data-action="waUser">וואטסאפ</button>` : ''}
      </div></div>
    ${S.profile.role === 'owner' && u.uid !== S.user.uid && u.active !== false ? `<div class="card">
      <h3>העברת הבעלות</h3>
      <p class="hint">${esc(u.name)} יהפוך לבעלים של העסק, ואתה תרד לדרגת מנהל. לעסק תמיד יש בעלים אחד, ורק הבעלים יכול להעביר את הבעלות.</p>
      <button class="btn danger" data-action="transferOwner">העברת הבעלות ל${esc(u.name)}</button></div>` : ''}
    ${isW ? `<h3>משובץ השבוע</h3>
      ${mine.length ? `<ul class="list">${mine.map(k => { const [d,id] = k.split('_'), s = shiftById(id);
        return `<li><span class="myshift"><i class="dot" style="--c:${s.color}"></i>יום ${DAYS[d]} ${fmt(addDays(S.weekStart,+d))}</span><span>${esc(s.name)}</span></li>`; }).join('')}</ul>`
        : `<p class="hint">לא משובץ השבוע.</p>`}
      <h3>זמינות לשבוע הזה</h3>${availEditor(true)}` : ''}`;
}

function viewNewUser(){
  if (S.created) {
    const c = S.created;
    return `<div class="card"><h3>${esc(c.name)} ${c.existing ? 'צורף לעסק' : 'נוסף למערכת'}</h3>
      <p class="hint">${c.existing ? `${esc(c.name)} כבר רשום במערכת ולכן צורף לעסק. הוא נכנס עם הסיסמה שכבר יש לו, והסיסמה שהקלדת לא נשמרה.`
        : 'שלח לעובד את פרטי הכניסה. הסיסמה לא תוצג שוב.'}</p>
      <pre>${esc(loginText(c))}</pre>
      <div class="toolbar">
        <button class="btn primary" data-action="copyCreated">העתקת פרטי הכניסה</button>
        <button class="btn" data-action="waCreated">שליחה בוואטסאפ</button>
        <button class="btn" data-action="newUser">הוספת עובד נוסף</button>
        <button class="btn" data-action="tab" data-v="team">חזרה לעובדים</button>
      </div></div>`;
  }
  return `
    <div class="toolbar"><button class="btn sm" data-action="tab" data-v="team">חזרה לעובדים</button></div>
    <div class="card"><h3>עובד חדש</h3>${userFields(true)}
      <div class="toolbar" style="margin-top:16px"><button class="btn primary" data-action="createUser">הוספת העובד</button></div></div>`;
}
const loginText = c => c.existing
  ? `שלום ${c.name}, צורפת למערכת המשמרות של ${ST().business} ב-DoTheShift.\nכניסה: ${location.origin + location.pathname}\nאימייל: ${c.email}\nהסיסמה שלך לא השתנתה. אם שכחת אותה, יש "שכחתי סיסמה" במסך הכניסה.`
  : `שלום ${c.name}, נפתח לך חשבון במערכת המשמרות של ${ST().business} ב-DoTheShift.\nכניסה: ${location.origin + location.pathname}\nאימייל: ${c.email}\nסיסמה: ${c.password}`;

function viewSettings(){
  const st = S.sDraft;
  const H = parseInt(st.deadlineHours) || 0, from = 168 - H;
  const dlDay = H ? Math.floor(from/24) : -1, dlHour = H ? from % 24 : 20;
  return `
    <h3>כללי</h3>
    <label class="field">שם העסק<input type="text" data-s="business" value="${esc(st.business)}"></label>

    <h3>מצבי זמינות</h3>
    <p class="hint">המצבים שעובדים בוחרים בהגשת זמינות. לכל מצב קובעים איך השיבוץ מתייחס אליו. עם עד 3 מצבים עובדים מחליפים מצב בלחיצות חוזרות, ומעל 3 נפתח חלון בחירה.</p>
    ${(st.availStates || []).map((x,i) => `<div class="statecard" style="--sc:${x.color}">
      <div class="row">
        <label class="field grow">שם המצב<input type="text" maxlength="30" data-s="availStates.${i}.name" value="${esc(x.name)}"></label>
        <label class="field">בשיבוץ<select data-s="availStates.${i}.level">${LEVELS.map(([l,t]) => `<option value="${l}" ${x.level===l?'selected':''}>${t}</option>`).join('')}</select></label>
      </div>
      <div class="swatches">${STATE_PALETTE.map(c => `<button class="swatch" style="background:${c}" data-action="stateColor" data-i="${i}" data-c="${c}" aria-label="בחירת צבע" aria-pressed="${c===x.color}"></button>`).join('')}</div>
      <div class="toolbar">
        <button class="btn sm" data-action="moveState" data-i="${i}" data-d="-1" ${i===0?'disabled':''}>למעלה</button>
        <button class="btn sm" data-action="moveState" data-i="${i}" data-d="1" ${i===st.availStates.length-1?'disabled':''}>למטה</button>
        <button class="btn sm danger" data-action="delState" data-i="${i}" ${st.availStates.length<=2?'disabled':''}>מחיקה</button>
      </div></div>`).join('')}
    <div class="toolbar"><button class="btn" data-action="addState" ${(st.availStates || []).length>=6?'disabled':''}>הוספת מצב</button>
      <button class="btn" data-action="resetStates">חזרה לברירת המחדל</button></div>

    <h3>תפקידים</h3>
    <p class="hint">למשל מלצר, קופאי, מחסנאי או נהג. לכל עובד אפשר לתת כמה תפקידים, ולכל משמרת לקבוע לאילו תפקידים היא מתאימה.</p>
    ${(st.positions || []).map((p,i) => { const others = st.positions.filter(o => o.id !== p.id);
      return `<div class="poscard">
      <div class="row">
        <label class="field grow">שם התפקיד<input type="text" data-s="positions.${i}.name" value="${esc(p.name)}"></label>
        <button class="btn sm danger" data-action="delPos" data-i="${i}" style="margin-bottom:2px">מחיקה</button></div>
      ${others.length ? `<div class="field">רואים בסידור גם את המשמרות של<small>${esc(p.name || 'התפקיד הזה')} תמיד רואה את המשמרות שלו ואת המשמרות הכלליות</small>
        <div class="posgrid">${others.map(o => `<label class="poschip"><input type="checkbox" data-action="posSees" data-i="${i}" data-id="${o.id}" ${(p.sees||[]).includes(o.id)?'checked':''}>${esc(o.name || 'ללא שם')}</label>`).join('')}</div></div>` : ''}
      </div>`; }).join('')}
    <div class="toolbar"><button class="btn" data-action="addPos">הוספת תפקיד</button></div>

    <h3>משמרות</h3>
    <p class="hint">המספרים הם כמה עובדים צריך בכל יום. 0 אומר שהמשמרת לא קיימת באותו יום.</p>
    ${st.shifts.map((s,i) => `<div class="shiftcard" style="--c:${s.color}">
      <div class="row">
        <label class="field grow">שם המשמרת<input type="text" data-s="shifts.${i}.name" value="${esc(s.name)}"></label>
        <label class="field">התחלה<input type="time" data-s="shifts.${i}.start" value="${esc(s.start)}"></label>
        <label class="field">סיום<input type="time" data-s="shifts.${i}.end" value="${esc(s.end)}"></label>
      </div>
      <div class="swatches">${PALETTE.map(c => `<button class="swatch" style="background:${c}" data-action="color" data-i="${i}" data-c="${c}" aria-label="בחירת צבע" aria-pressed="${c===s.color}"></button>`).join('')}</div>
      <div class="needs">${DAYS_SHORT.map((dn,d) => `<label>${dn}<input type="number" min="0" max="50" inputmode="numeric" data-s="shifts.${i}.need.${d}" value="${needAt(s,d)}"></label>`).join('')}</div>
      ${(st.positions || []).length ? `<div class="field">מתאימה לתפקידים<small>${(s.positions||[]).length ? 'רק עובדים עם התפקידים המסומנים יראו את המשמרת' : 'לא סומן תפקיד: המשמרת מתאימה לכולם'}</small>
        <div class="posgrid">${st.positions.map(p => `<label class="poschip"><input type="checkbox" data-action="shiftPos" data-i="${i}" data-id="${p.id}" ${(s.positions||[]).includes(p.id)?'checked':''}>${esc(p.name || 'ללא שם')}</label>`).join('')}</div></div>` : ''}
      <div class="toolbar">
        <button class="btn sm" data-action="moveShift" data-i="${i}" data-d="-1" ${i===0?'disabled':''}>הזזה ימינה</button>
        <button class="btn sm" data-action="moveShift" data-i="${i}" data-d="1" ${i===st.shifts.length-1?'disabled':''}>הזזה שמאלה</button>
        <button class="btn sm danger" data-action="delShift" data-i="${i}">מחיקת המשמרת</button>
      </div></div>`).join('')}
    <button class="btn" data-action="addShift">הוספת משמרת</button>

    <h3>מועד אחרון להגשה</h3>
    <p class="hint">אחרי המועד עובדים לא יכולים לשנות זמינות. אתה תמיד יכול.</p>
    <div class="row">
      <label class="field grow">יום, בשבוע שלפני<select data-dl="day">
        <option value="-1" ${dlDay<0?'selected':''}>ללא מועד אחרון</option>
        ${DAYS.map((dn,d) => `<option value="${d}" ${d===dlDay?'selected':''}>${dn}</option>`).join('')}</select></label>
      <label class="field">שעה<select data-dl="hour" ${dlDay<0?'disabled':''}>

const PERIODS = [['month','החודש'],['prev','החודש הקודם'],['year','השנה'],['all','כל הזמן']];
const monthName = d => new Intl.DateTimeFormat(LANG, { month:'long', year:'numeric' }).format(d);
const fmtH = h => String(Math.round(h*100)/100);
function periodRange(p){
  const n = new Date(), y = n.getFullYear(), m = n.getMonth();
  if (p === 'month') return [new Date(y,m,1), new Date(y,m+1,1)];
  if (p === 'prev')  return [new Date(y,m-1,1), new Date(y,m,1)];
  if (p === 'year')  return [new Date(y,0,1), new Date(y+1,0,1)];
  return [new Date(0), new Date(8.64e15)];
}
function periodTitle(p){
  const n = new Date();
  if (p === 'month') return monthName(n);
  if (p === 'prev') return monthName(new Date(n.getFullYear(), n.getMonth()-1, 1));
  if (p === 'year') return `שנת ${n.getFullYear()}`;
  return 'כל הזמן';
}

/* כל משמרת שובצה בסידור שפורסם = רשומה. שעות לפי הגדרות המשמרת ביום הפרסום */
function entries(){
  const out = [];
  for (const w of S.allWeeks || []) {
    if (!w.published) continue;
    const [y,m,d0] = w.id.split('-').map(Number);
    for (const [k,uids] of Object.entries(w.assignments || {})) {
      const [d,id] = k.split('_'), s = w.shiftsSnap?.[id] || shiftById(id);
      if (!s || !uids?.length) continue;
      const st = toMin(s.start); let en = toMin(s.end); if (en <= st) en += 1440;
      const start = new Date(y, m-1, d0 + +d, 0, st), end = new Date(y, m-1, d0 + +d, 0, en);
      for (const uid of uids) out.push({ uid, start, end, hours:(en-st)/60, name:s.name, color:s.color || '#8A94A6' });
    }
  }
  return out.sort((a,b) => a.start - b.start);
}
function inPeriod(list){ const [a,b] = periodRange(S.rep); return list.filter(e => e.start >= a && e.start < b); }
function sums(list){
  const now = Date.now(), done = list.filter(e => e.end <= now), next = list.filter(e => e.end > now);
  return { n:done.length, h:done.reduce((t,e) => t+e.hours, 0), fn:next.length, fh:next.reduce((t,e) => t+e.hours, 0) };
}
const periodPicker = () => `<div class="seg">${PERIODS.map(([p,l]) => `<button data-action="period" data-p="${p}" aria-pressed="${S.rep===p}">${l}</button>`).join('')}</div>`;
function statCards(list){
  const t = sums(list);
  return `<div class="cards">
    <div class="stat"><b>${fmtH(t.h)}</b><span>${isMgr() ? 'שעות שבוצעו' : 'שעות שעבדת'}</span></div>
    <div class="stat"><b>${t.n}</b><span>משמרות</span></div>
    ${t.fn ? `<div class="stat"><b>${fmtH(t.fh)}</b><span>שעות מתוכננות (${t.fn} משמרות)</span></div>` : ''}
  </div>`;
}
function entryList(list){
  if (!list.length) return `<p class="empty">אין משמרות בתקופה הזו.</p>`;
  const now = Date.now(); let lastM = '', html = '';
  const multi = S.rep === 'year' || S.rep === 'all';
  for (const e of [...list].reverse()) {
    const mn = monthName(e.start);
    if (multi && mn !== lastM) { if (lastM) html += '</ul>'; html += `<p class="month">${mn}</p><ul class="list">`; lastM = mn; }
    else if (!html) html = '<ul class="list">';
    html += `<li><span class="myshift"><i class="dot" style="--c:${e.color}"></i><span>יום ${DAYS[e.start.getDay()]} ${fmt(e.start)}<span class="sub" style="display:block">${esc(e.name)}, ${ltr(`${hhmm(e.start)}–${hhmm(e.end)}`)}</span></span></span>
      <span>${fmtH(e.hours)} ש׳${e.end > now ? '<span class="tag">מתוכנן</span>' : ''}</span></li>`;

  return html + '</ul>';
}

    e.name, hhmm(e.start), hhmm(e.end), fmtH(e.hours), e.end > now ? 'מתוכנן' : 'בוצע']));

/* נוכחות בפועל: מזווגים כל כניסה ליציאה שאחריה */
function sessionsOf(punches){
  const by = {};
  for (const p of punches) {
    const arr = by[p.uid] ??= [];
    const open = arr.length && arr[arr.length-1].in && !arr[arr.length-1].out ? arr[arr.length-1] : null;
    if (p.type === 'in') { if (open) open.noOut = true; arr.push({ in:p.at, out:null, inP:p, outP:null, by:[p.by] }); }
    else if (open) { open.out = p.at; open.outP = p; open.by.push(p.by); }
    else arr.push({ in:null, out:p.at, inP:null, outP:p, by:[p.by] });
  }
  const now = Date.now();
  Object.values(by).forEach(arr => arr.forEach(x => {
    x.hours = x.in && x.out ? (x.out - x.in) / 3600e3 : 0;
    x.issue = !x.in ? 'חסרה כניסה' : !x.out ? (x.noOut || now - x.in > 16*3600e3 ? 'חסרה יציאה' : 'בעבודה עכשיו') : '';
    const ps = [x.inP, x.outP].filter(Boolean);
    x.mark = ps.some(p => p.manual) ? 'ידני' : ps.some(p => p.origAt) ? 'נערך' : '';
  }));
  return by;
}

function downloadActualCsv(){
  const rows = [['עובד','תאריך','יום','כניסה','יציאה','שעות','הערה','מכשיר','תיקון']];
  Object.entries(S.actual || {}).filter(([uid]) => !S.repUid || uid === S.repUid).forEach(([uid,arr]) => arr.forEach(x => {

/* ---------- actions ---------- */
function confirmLeave(){
  if ((S.dirty || S.sDirty) && !confirm('יש שינויים שלא נשמרו. להמשיך בלי לשמור?')) return false;
  S.dirty = false; S.sDirty = false; return true;
}
/* העותק של כל עובד: רק משמרות שהוא רשאי לראות (לפי ההגדרות), ותמיד משמרות שהוא משובץ בהן */
function viewFor(u, w){
  if (!w.published) return { published:false };
  const ids = new Set(), all = w.assignments || {};
  Object.keys(all).forEach(k => {
    const id = k.split('_')[1], s = shiftById(id) || { id, positions:[] };
    if (canSee(u, s) || (all[k] || []).includes(u.uid)) ids.add(id);
  });
  const assignments = {}, shiftsSnap = {};
  Object.entries(all).forEach(([k,v]) => { if (ids.has(k.split('_')[1])) assignments[k] = v; });
  ids.forEach(id => { const sn = w.shiftsSnap?.[id]; if (sn) shiftsSnap[id] = sn; });
  return { published:true, message:w.message || '', assignments, shiftsSnap };
}
async function syncViews(weekIdv, w){
  const map = {};
  S.users.forEach(u => { map[u.uid] = viewFor(u, w); });
  await B.writeViews(weekIdv, map);
}
/* אחרי שינוי בהגדרות או בעובדים: מעדכנים את העותקים של הסידורים שפורסמו (מהשבוע הנוכחי והלאה, או את כולם) */
async function resyncPublished(all = false){
  syncClockList().catch(e => console.warn(e));
  syncNames().catch(e => console.warn(e));
  const from = weekId(sundayOf(new Date()));
  const weeks = (await B.listWeeks()).filter(w => w.published && (all || w.id >= from));
  for (const w of weeks) await syncViews(w.id, w);
}
async function saveWeek(patch, msg){
  try{
    await B.updateWeek(wid(), patch); S.week = { ...S.week, ...patch }; S.allWeeks = null;
    if ('locked' in patch) await B.setWeekStatus(wid(), { locked:!!patch.locked });
    if (S.week.published || patch.published === false) await syncViews(wid(), S.week);
    if (msg) toast(msg);
  }
  catch(e){ toast(errMsg(e)); render(); return false; }
  render(); return true;
}
const actions = {
  async demoLogin(el){ S.freshLogin = true; await B.signIn(el.dataset.uid); },
  period(el){ S.rep = el.dataset.p; if ((S.view === 'reports' || S.view === 'hours') && S.repMode === 'actual') loadActual(); else render(); },
  repMode(el){ S.repMode = el.dataset.m; S.repUid = null; if (S.repMode === 'actual') loadActual(); else render(); },
  csvActual(){ downloadActualCsv(); },
  mineMode(el){ S.mineMode = el.dataset.m; render(); },
  // החלפת שפה: נשמרת במכשיר ובחשבון (כדי שההתראות יגיעו באותה שפה), ואז טוענים מחדש
  async setLang(el){
    const l = el?.dataset.l === 'en' ? 'en' : 'he';
    el?.closest('details')?.removeAttribute('open');
    if (l === LANG || !confirmLeave()) return;
    try { localStorage.setItem('lang', l); } catch {}
    if (S.user && B && !B.demo) await B.setLang(l).catch(e => console.warn(e));
    const u = new URL(location.href); u.searchParams.delete('lang'); location.replace(u.toString());
  },
  mgrMode(el){ S.mgrMode = el.dataset.m; render(); window.scrollTo(0,0); },
  async reqGive(el){ await reqDo(() => B.addRequest({ type:'give', week:wid(), k:el.dataset.k, vols:[] }), 'המשמרת הוצעה לעובדים. עד שהמנהל מאשר, אתה עדיין משובץ'); },
  async reqTake(el){ await reqDo(() => B.addRequest({ type:'take', week:wid(), k:el.dataset.k }), 'הבקשה נשלחה למנהל'); },
  async reqVol(el){ await reqDo(() => B.volunteer(el.dataset.id, true), 'הבקשה נשלחה למנהל'); },
  async reqUnvol(el){ await reqDo(() => B.volunteer(el.dataset.id, false), 'הבקשה בוטלה'); },
  async reqCancel(el){ await reqDo(() => B.updateRequest(el.dataset.id, { status:'cancelled' }), 'הבקשה בוטלה'); },
  async reqReject(el){ await reqDo(() => B.updateRequest(el.dataset.id, { status:'rejected', doneBy:S.user.uid, doneAt:new Date() }), 'הבקשה נדחתה'); },
  async reqApprove(el){
    const r = S.reqs.find(x => x.id === el.dataset.id), uid = el.dataset.uid; if (!r) return;
    const a = asg(), list = a[r.k] || [];
    if (r.type === 'give' && !list.includes(r.by)) {
      await reqDo(() => B.updateRequest(r.id, { status:'rejected', doneBy:S.user.uid, doneAt:new Date() }));
      return toast(`הבקשה כבר לא בתוקף: ${nameOf(r.by)} כבר לא במשמרת הזו`);
    }
    if (list.includes(uid)) return toast(`${nameOf(uid)} כבר במשמרת הזו`);
    if (!future(r.k)) return toast('המשמרת כבר התחילה. אפשר רק לדחות את הבקשה');
    el.disabled = true;
    a[r.k] = r.type === 'give' ? list.map(x => x === r.by ? uid : x) : [...list, uid];
    if (!await saveWeek({ assignments:a })) { el.disabled = false; return; }
    await reqDo(() => B.updateRequest(r.id, { status:'done', to:uid, doneBy:S.user.uid, doneAt:new Date() }),
      r.type === 'give' ? `המשמרת עברה מ${nameOf(r.by)} ל${nameOf(uid)}` : `השיבוץ של ${nameOf(uid)} אושר`);
  },
  peOpen(el){ S.pe = { uid:S.repUid, i:+el.dataset.i }; S.sheetMode = 'punch'; renderPunchSheet(); $sheet.showModal(); },
  async peSave(el){
    const pe = S.pe, x = pe.i >= 0 ? S.actual[pe.uid]?.[pe.i] : null, v = id => document.getElementById(id)?.value || '';
    const at = { in:fromIn(v('pe-ind'), v('pe-int')), out:fromIn(v('pe-outd'), v('pe-outt')) };
    if (!at.in && !at.out) return toast('צריך למלא לפחות שעת כניסה או שעת יציאה');
    if (at.in && at.out && at.out <= at.in) return toast('שעת היציאה צריכה להיות אחרי שעת הכניסה. יציאה אחרי חצות? שנה את תאריך היציאה');
    if ([at.in, at.out].some(d => d && d > new Date())) return toast('אי אפשר לרשום שעה שעוד לא הגיעה');
    el.disabled = true;
    try{
      for (const k of ['in','out']) {
        const P = x?.[k + 'P'];

  async kPick(el){
    const uid = el.dataset.uid;
    Object.assign(S.kiosk, { sel:uid, busy:false, done:null }); S.sheetMode = 'kiosk'; renderKioskSheet(); $sheet.showModal();
    await loadPunches();
    if ($sheet.open && S.kiosk.sel === uid && !S.kiosk.done) { const pw = document.getElementById('k-pw')?.value || ''; renderKioskSheet(); const f = document.getElementById('k-pw'); if (f) f.value = pw; }

  async kPunch(el){
    const k = S.kiosk, u = S.users.find(x => x.uid === k.sel), type = el.dataset.type;
    const pw = document.getElementById('k-pw')?.value || '';
    if (!u) return;
    if (!pw) return toast('צריך להקליד סיסמה');
    if (!u.email) return toast('לעובד הזה אין אימייל במערכת. פנה למנהל');
    // יציאה פחות מ-15 דקות אחרי הכניסה: כנראה לחיצה בטעות, אז שואלים קודם
    const pin = lastPunch()[u.uid];
    if (type === 'out' && !el.dataset.sure && pin?.type === 'in' && Date.now() - pin.at < 15*60e3) {
      const m = Math.floor((Date.now() - pin.at) / 60e3);
      el.dataset.sure = '1'; el.textContent = 'כן, לצאת בכל זאת';
      el.closest('.toolbar').insertAdjacentHTML('beforebegin', `<p class="kwarn">נכנסת ${m < 1 ? 'לפני פחות מדקה' : m === 1 ? 'רק לפני דקה' : `רק לפני ${m} דקות`}. לצאת בכל זאת?</p>`);
      el.insertAdjacentHTML('afterend', '<button class="btn" data-action="closeSheet">ביטול</button>');
      return;
    }
    k.busy = true; el.disabled = true;
    try{
      const uid = await B.verifyEmployee(u.email, pw);
      if (uid !== u.uid) throw { code:'auth/invalid-credential' };
      const prev = lastPunch()[u.uid];
      await B.addPunch(u.uid, type);
      await loadPunches();
      const mine = lastPunch()[u.uid];
      k.done = { name:u.name, type, at:mine?.at || new Date(), dur: type === 'out' && prev?.type === 'in' ? durText((mine?.at || new Date()) - prev.at) : '' };
      renderKioskSheet();
      setTimeout(() => { if (S.kiosk.done && $sheet.open) $sheet.close(); }, 3500);
    }catch(e){
      if (String(e?.code).includes('permission-denied') && await clockDisabled()) return;
      toast(/invalid-credential|wrong-password|user-not-found/.test(e?.code || '') ? 'הסיסמה שגויה' : errMsg(e));
      k.busy = false; el.disabled = false;
      const f = document.getElementById('k-pw'); if (f) { f.value = ''; f.focus(); }
    }
  },
