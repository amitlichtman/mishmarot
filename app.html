    try{ await B.sendReset(u.email); toast(`נשלח מייל לאיפוס סיסמה ל-${u.email}`); }catch(e){ toast(errMsg(e)); }
  },
  waUser(){ const u = S.users.find(x => x.uid === S.editUid); window.open(`https://wa.me/${waPhone(u.phone)}`, '_blank'); },
  async transferOwner(el){
    const u = S.users.find(x => x.uid === S.editUid);
    if (!u || S.profile.role !== 'owner' || u.uid === S.user.uid || u.active === false) return;
    if (!confirm(`להעביר את הבעלות על ${ST().business} ל${u.name}?\n\n${u.name} יהיה הבעלים, ואתה תהיה מנהל. אי אפשר לבטל את זה בעצמך: רק ${u.name} יוכל להחזיר לך את הבעלות.`)) return;
    el.disabled = true;
    try{
      await B.transferOwnership(u.uid);
      u.role = 'owner';
      S.profile.role = 'manager';
      const me = S.users.find(x => x.uid === S.user.uid); if (me) me.role = 'manager';
      S.uDraft = clone(u);
      toast(`${u.name} הוא עכשיו הבעלים`);
    }catch(e){ toast(errMsg(e)); el.disabled = false; }
    render();
  },

  /* הגדרות */
  color(el){ S.sDraft.shifts[+el.dataset.i].color = el.dataset.c; S.sDirty = true; render(); },
  addShift(){
    const n = S.sDraft.shifts.length;
    S.sDraft.shifts.push({ id:'s'+Math.random().toString(36).slice(2,8), name:'משמרת חדשה', start:'09:00', end:'17:00', color:PALETTE[n % PALETTE.length], need:[1,1,1,1,1,1,1] });
    S.sDirty = true; render();
  },
  moveShift(el){
    const i = +el.dataset.i, j = i + +el.dataset.d, sh = S.sDraft.shifts;
    [sh[i], sh[j]] = [sh[j], sh[i]]; S.sDirty = true; render();
  },
  delShift(el){
    const s = S.sDraft.shifts[+el.dataset.i];
    if (!confirm(`למחוק את משמרת "${s.name}"? השיבוצים שלה יוסתרו בכל השבועות.`)) return;
    S.sDraft.shifts.splice(+el.dataset.i, 1); S.sDirty = true; render();
  },
  async saveSettings(el){
    const st = clone(S.sDraft);
    if (!st.shifts.length) return toast('צריך לפחות משמרת אחת');
    st.availStates = (st.availStates || []).map(x => ({ id:x.id, name:(x.name || '').trim(), color:x.color, level:x.level }));
    if (st.availStates.length < 2 || st.availStates.length > 6) return toast('צריך בין 2 ל-6 מצבי זמינות');
    if (st.availStates.some(x => !x.name)) return toast('לכל מצב זמינות צריך שם');
    if (new Set(st.availStates.map(x => x.name)).size !== st.availStates.length) return toast('יש שני מצבי זמינות עם אותו שם');
    if (!st.availStates.some(x => x.level !== 'never')) return toast('צריך לפחות מצב אחד שאפשר לשבץ בו');
    st.positions = (st.positions || []).map(p => ({ id:p.id, name:(p.name||'').trim(), sees:(p.sees || []).filter(x => x !== p.id && (st.positions || []).some(o => o.id === x)) }));
    if (st.positions.some(p => !p.name)) return toast('לכל תפקיד צריך שם');
    if (new Set(st.positions.map(p => p.name)).size !== st.positions.length) return toast('יש שני תפקידים עם אותו שם');
    for (const s of st.shifts) {
      s.positions = (s.positions || []).filter(id => st.positions.some(p => p.id === id));
      s.name = (s.name||'').trim();
      if (!s.name) return toast('לכל משמרת צריך שם');
      if (!s.start || !s.end) return toast(`צריך שעת התחלה וסיום למשמרת "${s.name}"`);
      s.need = Array.from({length:7}, (_,d) => needAt(s,d));
    }
    st.business = (st.business||'').trim() || 'DoTheShift';
    st.minRest = Math.max(0, parseInt(st.minRest) || 0);
    st.maxPerWeek = Math.max(0, parseInt(st.maxPerWeek) || 0);
    st.deadlineHours = Math.max(0, parseInt(st.deadlineHours) || 0);
    st.tzMin = -new Date().getTimezoneOffset();
    st.appUrl = location.origin + location.pathname;
    el.disabled = true;
    const renamed = st.business !== S.settings.business;
    try{ await B.saveSettings(st); await B.setCompanyName(st.business);
      if (renamed) {
        B.renameInLists([...S.users, ...S.clocks].map(u => u.uid), st.business).catch(e => console.warn(e));
        const c = S.companies.find(x => x.cid === S.cid); if (c) c.name = st.business;
      }
      S.settings = normSettings(st); S.sDraft = clone(S.settings); S.sDirty = false; toast('ההגדרות נשמרו'); resyncPublished().catch(e => console.warn(e)); }
    catch(e){ toast(errMsg(e)); }
    render();
  },
};

/* ---------- events ---------- */
function setPath(obj, path, v){ const p = path.split('.'); let o = obj; for (let i = 0; i < p.length-1; i++) o = o[p[i]]; o[p.at(-1)] = v; }
const readInput = t => t.type === 'checkbox' ? t.checked : t.value;

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (el && actions[el.dataset.action]) actions[el.dataset.action](el);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.s != null) {
    setPath(S.sDraft, t.dataset.s, readInput(t));
    if (!S.sDirty) { S.sDirty = true; const sp = document.querySelector('.savebar span'); if (sp) { sp.className = 'dirty'; sp.textContent = 'יש שינויים שלא נשמרו'; } }
    if (t.type === 'checkbox') render();
  }
  else if (t.dataset.u != null) S.uDraft[t.dataset.u] = readInput(t);
  else if (t.id === 'weekMsg') S.msgDraft = t.value;
  else if (t.id === 'crewQ') { S.crewQ = t.value; render(); const f = document.getElementById('crewQ'); if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); } }
  else if (t.id === 'kq') { S.kiosk.q = t.value; render(); const f = document.getElementById('kq'); if (f) { f.focus(); f.setSelectionRange(f.value.length, f.value.length); } }
  else if (t.id === 'note') {
    S.note = t.value;
    if (!S.dirty) { S.dirty = true; const sp = document.querySelector('.savebar span'); if (sp) { sp.className = 'dirty'; sp.textContent = 'יש שינויים שלא נשמרו'; } }
  }
});
document.addEventListener('change', e => {
  if (e.target.dataset.s?.startsWith('positions.')) { render(); return; }  // שם תפקיד חדש מופיע מיד גם במשמרות
  if (!e.target.dataset.dl) return;
  const day = +document.querySelector('[data-dl="day"]').value, hour = +document.querySelector('[data-dl="hour"]').value;
  S.sDraft.deadlineHours = day < 0 ? 0 : 168 - (day*24 + hour);
  S.sDirty = true; render();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'kx-pw') { e.preventDefault(); document.querySelector('#sheet [data-action=kExitConfirm]')?.click(); return; }
  if (e.key === 'Enter' && e.target.id === 'k-pw') { e.preventDefault(); document.querySelector('#sheet [data-action=kPunch]')?.click(); return; } if (e.key === 'Enter' && e.target.matches('.login input')) document.querySelector('.login .btn.primary')?.click(); });
$sheet.addEventListener('change', async e => {
  const uid = e.target.dataset.assign; if (!uid) return;
  const a = asg(), k = S.openKey;
  a[k] = e.target.checked ? [...a[k], uid] : a[k].filter(x => x !== uid);
  await saveWeek({ assignments:a });
  renderSheet();
});
$sheet.addEventListener('close', () => {
  const wasKiosk = S.sheetMode === 'kiosk';
  S.openKey = null; S.sheetMode = null;
  if (wasKiosk) { clearTimeout(kioskIdle); Object.assign(S.kiosk, { sel:null, busy:false, done:null }); if (isClock()) render(); }
});
$sheet.addEventListener('click', e => { if (e.target === $sheet) $sheet.close(); });

/* שעון חי במסך הנוכחות (בלי פנייה לשרת), ורענון הרשימה וההחתמות פעם בשעה */
setInterval(() => { const c = document.getElementById('kclock'); if (c) c.textContent = clockText(); }, 1000);
setInterval(() => { if (isClock() && !$sheet.open) loadPunches(); }, 3600e3);   // פעם בשעה, כדי לחסוך קריאות בשרת

/* ---------- הצעה להתקין את האפליקציה ---------- */
/* מי שפתח באתר ולא התקין: באנדרואיד כפתור התקנה, באייפון הוראות (אפל לא מאפשרת התקנה בלחיצה) */
let installEvt = null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let pushHidden = false;
/* מציעים התראות רק אחרי כניסה, כשהדפדפן עוד לא שאל. באייפון רק באפליקציה מותקנת */
const pushOffer = () => !pushHidden && !!S.profile && !isClock() && typeof Notification !== 'undefined'
  && Notification.permission === 'default' && (isStandalone() || !isIOS());
let installHidden = false;                       // "לא עכשיו" מסתיר רק עד הכניסה הבאה לאתר
const installSnoozed = () => installHidden;
function renderInstall(){
  const box = document.getElementById('install'); if (!box) return;
  let kind = isStandalone() || installSnoozed() || isClock() ? null : installEvt ? 'android' : isIOS() ? 'ios' : null;
  if (!kind && pushOffer()) kind = 'push';
  box.hidden = !kind;
  if (!kind) { box.innerHTML = ''; return; }
  if (kind === 'push') {
    box.innerHTML = `<div class="inst"><img src="icon-192.png" alt="">
      <div class="it"><b>הפעלת התראות</b><span>הודעה כשהסידור מתפרסם וכשיש תשובה לבקשות</span></div>
      <div class="ib"><button class="btn sm primary" data-action="pushOn">הפעלה</button><button class="btn sm" data-action="pushLater">לא עכשיו</button></div></div>`;
    return;
  }
  const share = '<svg viewBox="0 0 24 24" width="17" height="17" aria-label="שיתוף"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5M6 11H5v10h14V11h-1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  box.innerHTML = `<div class="inst"><img src="icon-192.png" alt="">
    <div class="it"><b>התקנת האפליקציה</b><span>${kind === 'android'
      ? 'אייקון במסך הבית, ונפתח במסך מלא כמו אפליקציה'
      : `לוחצים על כפתור השיתוף ${share} ואז על "הוספה למסך הבית"`}</span></div>
    <div class="ib">${kind === 'android' ? '<button class="btn sm primary" data-action="installApp">התקנה</button>' : ''}
      <button class="btn sm" data-action="installLater">לא עכשיו</button></div></div>`;
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; renderInstall(); });
/* התראה שמגיעה כשהאפליקציה פתוחה: מציגים אותה כהתראה רגילה של הטלפון. אם אי אפשר, הודעה בתחתית המסך */
window.addEventListener('push', async e => {
  const n = e.detail?.notification; if (!n) return;
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    if (reg && Notification.permission === 'granted') {
      await reg.showNotification(n.title, { body:n.body, icon:'icon-192.png', dir:LANG === 'en' ? 'ltr' : 'rtl', lang:LANG, data:{ local:true } });
      return;
    }
  } catch (err) { console.warn(err); }
  toast(`${n.title}: ${n.body}`);
});
window.addEventListener('appinstalled', () => { installEvt = null; renderInstall(); });
Object.assign(actions, {
  async installApp(){
    if (!installEvt) return;
    installEvt.prompt();
    const { outcome } = await installEvt.userChoice.catch(() => ({}));
    installEvt = null;
    if (outcome === 'dismissed') installHidden = true;
    renderInstall();
  },
  installLater(){ installHidden = true; renderInstall(); },
  async pushOn(el){
    el.disabled = true;
    try{
      const perm = await Notification.requestPermission();     // חייב לקרות מיד אחרי הלחיצה
      if (perm !== 'granted') throw { code:'push-denied' };
      S.pushToken = await B.enablePush(); toast('ההתראות הופעלו');
      if ($sheet.open && S.sheetMode === 'notif') renderNotifSheet();
    }catch(e){ toast(errMsg(e)); pushHidden = true; }
    renderInstall();
  },
  pushLater(){ pushHidden = true; renderInstall(); },
  async notifOpen(){
    S.prefs = await B.getPrefs(S.cid).catch(() => null) || {};
    S.sheetMode = 'notif'; renderNotifSheet(); $sheet.showModal();
  },
  async notifSave(el){
    const d = {}; NOTIF_TYPES.forEach(([k]) => { const c = $sheet.querySelector(`[data-pref="${k}"]`); d[k] = c ? c.checked : (S.prefs?.[k] !== false); });
    el.disabled = true;
    try{ await B.setPrefs(S.cid, d); S.prefs = d; $sheet.close(); toast('הגדרות ההתראות נשמרו'); }
    catch(e){ toast(errMsg(e)); el.disabled = false; }
  },
});

/* ---------- boot ---------- */
(async () => {
  render();
  try{ B = FIREBASE_CONFIG.apiKey ? await firebaseBackend(FIREBASE_CONFIG) : demoBackend(); }
  catch(e){ console.error(e); B = demoBackend(); toast('החיבור ל-Firebase נכשל, עובר למצב הדגמה'); }
  B.onAuth(async u => {
    S.user = u; S.ready = true;
    if (S.signingUp) return;  // ההרשמה ממשיכה בעצמה
    if (u) { try{ await afterLogin(); }catch(e){ toast(errMsg(e)); render(); } }
    else { S.profile = null; S.cid = null; S.dirty = false; S.sDirty = false; render(); }
  });
})();
</script>
</body>
</html>
