<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1E2433">
<title>משמרות</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="משמרות">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Secular+One&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E2433; --paper:#F5F6F8; --line:#DCE0E8; --muted:#5F6878;
  --warn:#B4400E; --ok:#17855B;
  font-family:'Rubik',system-ui,sans-serif; color:var(--ink); background:var(--paper);
}
*{box-sizing:border-box}
body{margin:0;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;padding:12px 16px 120px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 14px}
.brand{display:flex;align-items:center;gap:10px;margin:0;font-family:'Secular One',sans-serif;font-weight:400;font-size:clamp(1.2rem,5.2vw,1.6rem);min-width:0;flex:1}
.bars{display:flex;gap:3px;align-items:flex-end;height:22px}
.bars i{display:block;width:6px;border-radius:2px}
.bars i:nth-child(1){height:12px;background:#E9A23B}
.bars i:nth-child(2){height:17px;background:#D6577A}
.bars i:nth-child(3){height:22px;background:#34478F}
.who{display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--muted)}
.who .me{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25}
.who .me b{color:var(--ink);font-weight:500}
.who{flex:none}
.who .me{max-width:30vw}
.who .me b,.who .me small{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .me small{font-size:.78rem}
.link{border:0;background:none;text-decoration:underline;padding:4px;color:var(--ink)}
.demo{background:#FFF7E6;border:1px solid #F3D9A4;border-radius:10px;padding:8px 12px;font-size:.88rem;margin-bottom:12px}

/* tabs + week */
.tabs{display:flex;gap:4px;background:#E6E9EF;border-radius:10px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:7px;font-weight:500}
.tabs button[aria-current="page"]{background:#fff;box-shadow:0 1px 2px rgba(30,36,51,.14)}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 0 6px}
.weeknav h2{font-family:'Secular One',sans-serif;font-weight:400;font-size:1.3rem;margin:0;text-align:center}
.weeknav small{display:block;font-family:'Rubik';font-size:.8rem;color:var(--muted)}
.iconbtn.refresh{width:36px;height:36px;color:var(--ink)}
.iconbtn.refresh.busy svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:8px;width:42px;height:42px;font-size:1.2rem;line-height:1;flex:none;display:inline-grid;place-items:center}

h3{font-family:'Secular One',sans-serif;font-weight:400;font-size:1.15rem;margin:26px 0 6px}
.hint{color:var(--muted);margin:4px 0 10px;font-size:.92rem}
.notice{background:#EEF1F6;border-radius:10px;padding:10px 12px;margin:8px 0}
.notice.msg{background:#fff;border:1.5px solid var(--line);white-space:pre-wrap}
.empty{text-align:center;color:var(--muted);padding:40px 12px}
.loading{text-align:center;color:var(--muted);padding:60px 0}

.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--muted);margin:0 0 6px}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:16px;height:16px;border-radius:4px;display:inline-block}

/* day grid */
.grid{overflow-x:auto;padding-bottom:2px}
.day{display:grid;grid-template-columns:58px repeat(var(--n,3),minmax(76px,1fr));
  min-width:calc(58px + var(--n,3) * 82px);gap:6px;padding:7px 0;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.dlabel{display:flex;flex-direction:column;justify-content:center;position:sticky;inset-inline-start:0;z-index:2;background:var(--paper);margin-block:-7px;padding-block:7px;box-shadow:-6px 0 6px -6px rgba(30,36,51,.25)}
.dlabel b{font-weight:700}
.dlabel span{color:var(--muted);font-size:.82rem}
.off{border-radius:10px;background:repeating-linear-gradient(-45deg,#ECEEF2 0 2px,transparent 2px 9px)}

.chip{border-radius:10px;border:1.5px dashed #C5CBD6;background:#fff;padding:7px 4px;min-height:66px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:transform .08s ease}
.chip:active:not(:disabled){transform:scale(.96)}
.chip .sn{font-weight:700;font-size:.88rem}
.chip .st{font-size:.75rem}
.chip.unset .st{color:var(--muted)}
.chip.yes{background:var(--c);border:1.5px solid var(--c);color:var(--on)}
.chip.maybe{border:2px solid var(--c);background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--c) 22%,#fff) 0 6px,#fff 6px 12px)}
.chip.no{background:#E9ECF1;border:1.5px solid #E9ECF1;color:var(--muted)}
.chip.no .sn{text-decoration:line-through}
.chip:disabled{cursor:default}

.slot{border-radius:10px;border:1.5px solid var(--line);border-top:5px solid var(--c);background:#fff;
  padding:6px;min-height:72px;text-align:right;display:flex;flex-direction:column;gap:2px}
.slot .sn{display:flex;justify-content:space-between;gap:4px;font-weight:700;font-size:.84rem}
.slot em{font-style:normal;font-weight:500}
.slot.short em{color:var(--warn)}
.slot.short{background:#FFF8F4}
.slot .names{font-size:.8rem;line-height:1.35}
.slot .names.none{color:var(--muted)}

/* buttons, status */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 10px}
.btn{border:1.5px solid var(--ink);background:#fff;border-radius:9px;padding:9px 14px;font-weight:500}
.btn.primary{background:var(--ink);color:#fff}
.btn.sm{padding:6px 10px;font-size:.85rem}
.btn.danger{border-color:var(--warn);color:var(--warn)}
.btn:disabled{opacity:.45;cursor:default}
.status{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.86rem;margin:4px 0 8px}
.pill{border-radius:99px;padding:2px 10px;background:#E6E9EF;white-space:nowrap}
.pill.ok{background:#DDF3E8;color:var(--ok)}
.pill.warn{background:#FDEDE4;color:var(--warn)}

/* forms */
.field{display:block;margin-top:12px;font-weight:500;font-size:.92rem}
.field small{display:block;font-weight:400;color:var(--muted)}
textarea,select,input[type=email],input[type=password],input[type=text],input[type=tel],input[type=number],input[type=time]{
  width:100%;margin-top:5px;border:1.5px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff}
textarea{min-height:70px;resize:vertical}
input:disabled,select:disabled{background:#F0F2F5;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row .field{flex:1;min-width:110px}
.row .grow{flex:2;min-width:150px}
.check{display:flex;gap:10px;align-items:center;margin-top:14px}
.check input{width:20px;height:20px;accent-color:var(--ink);flex:none}
.card{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:4px 14px 14px;margin:12px 0}
.card pre{white-space:pre-wrap;font:inherit;background:#F5F6F8;border-radius:8px;padding:10px;margin:12px 0}

.shiftcard{background:#fff;border:1.5px solid var(--line);border-inline-start:7px solid var(--c);border-radius:12px;padding:2px 14px 12px;margin:12px 0}
.swatches{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
.swatch{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--ink)}
.needs{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.needs label{display:flex;flex-direction:column;align-items:center;font-size:.8rem;color:var(--muted)}
.needs input{text-align:center;padding:8px 0}

/* save bar */
.savebar{position:fixed;inset-inline:0;bottom:0;background:rgba(245,246,248,.95);backdrop-filter:blur(6px);
  border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:5}
.savebar .in{max-width:780px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.savebar span{font-size:.88rem;color:var(--muted)}
.savebar span.dirty{color:var(--warn)}

/* lists */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list li.btnrow{padding:0}
.userbtn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;background:none;text-align:right;padding:11px 2px}
.sub{color:var(--muted);font-size:.84rem}
.myshift{display:flex;align-items:center;gap:10px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}

/* login */
.login{max-width:380px;margin:8vh auto 0}
.login h1{font-family:'Secular One',sans-serif;font-weight:400;font-size:2.3rem;margin:0 0 4px;display:flex;align-items:center;gap:12px}
.login p{color:var(--muted);margin-top:0}
.userpick{display:grid;gap:8px;margin-top:16px}
.userpick button{text-align:right;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:12px;display:flex;justify-content:space-between}
.userpick button span{color:var(--muted);font-size:.85rem}

/* sheet */
dialog{border:0;border-radius:14px;padding:0;width:min(480px,calc(100% - 20px));max-height:85vh}
dialog::backdrop{background:rgba(30,36,51,.45)}
.sheet{padding:0 18px 18px}
.sheet header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-top:6px solid var(--c);margin:0 -18px 6px;padding:14px 18px 0}
.sheet h2{font-family:'Secular One',sans-serif;font-weight:400;font-size:1.2rem;margin:0}
.sheet h4{margin:14px 0 4px;font-size:.85rem;color:var(--muted);font-weight:500}
.opt{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid #EEF0F3}
.opt input{width:20px;height:20px;accent-color:var(--ink);flex:none}
.opt .meta{margin-inline-start:auto;text-align:left;font-size:.78rem;color:var(--muted)}
.opt .meta .w{color:var(--warn);display:block}

.chip .hr{font-size:.68rem;opacity:.85;direction:ltr}
.slot .hr{font-size:.7rem;color:var(--muted);direction:ltr;text-align:right}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 10px}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:8px 0 6px}
.stat{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:'Secular One',sans-serif;font-weight:400;font-size:1.7rem;line-height:1.2}
.stat span{color:var(--muted);font-size:.84rem}
.tag{font-size:.75rem;border-radius:99px;padding:1px 8px;background:#E6E9EF;color:var(--muted);margin-inline-start:6px}
.month{font-weight:700;margin:16px 0 0;font-size:.95rem}
.tot{font-weight:700;border-top:2px solid var(--ink)!important}
.divider{margin:28px 0 8px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted)}
.picklist{margin-top:8px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:0 14px}
.picklist .userbtn b{font-size:1.05rem}
.poscard{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:2px 14px 12px;margin:10px 0}
.posgrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;font-weight:400}
.poschip{display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px 6px 14px;cursor:pointer}
.poschip:has(input:checked){border-color:var(--ink);background:#EEF1F6}
.poschip input{width:18px;height:18px;accent-color:var(--ink);margin:0}
.brandbtn{display:flex;align-items:center;gap:10px;border:0;background:none;padding:2px 0;font:inherit;color:inherit;text-align:right;min-width:0;max-width:100%}
.brandbtn .bars{flex:none}
.brandbtn .bn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.brandbtn .caret{font-family:'Rubik';font-size:.9rem;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:10px 16px;border-radius:10px;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:20}
#toast.show{opacity:1}

@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
@media print{
  body{background:#fff}
  .tabs,.toolbar,.weeknav .iconbtn,.savebar,.who,.demo,.hint,.noprint{display:none!important}
  .grid{overflow:visible}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script type="module">
/* ===== פרטי Firebase. אם apiKey ריק, האפליקציה רצה במצב הדגמה ===== */

/* ===== ברירות מחדל. המנהל משנה הכול במסך ההגדרות ===== */
const PALETTE = ['#E9A23B','#D6577A','#34478F','#2E8B7A','#7A5AC8','#C2662D','#4A90C2','#8A94A6'];
const DEFAULT_SETTINGS = {
  business: 'משמרות',
  positions: [ { id:'waiter', name:'מלצר' }, { id:'cook', name:'טבח' } ],
  shifts: [
    { id:'morning', name:'בוקר', start:'07:00', end:'15:00', color:'#E9A23B', need:[2,2,2,2,2,2,2] },
    { id:'evening', name:'ערב',  start:'15:00', end:'23:00', color:'#D6577A', need:[2,2,2,2,2,2,2] },
    { id:'night',   name:'לילה', start:'23:00', end:'07:00', color:'#34478F', need:[1,1,1,1,1,1,1] },
  ],
  deadlineHours: 0,   // כמה שעות לפני תחילת השבוע נסגרת ההגשה. 0 = ללא
  tzMin: 180,
  minRest: 8,
  onePerDay: true,
  maxPerWeek: 6,
};
const DAYS = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const DAYS_SHORT = ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
const LABEL = { yes:'יכול', maybe:'מעדיף שלא', no:'לא יכול', unset:'לא סומן' };
const CYCLE = { unset:'yes', yes:'maybe', maybe:'no', no:'unset' };

/* ---------- utils ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const sundayOf = d => { const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-x.getDay()); return x; };
const weekId = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fmt = d => `${d.getDate()}.${d.getMonth()+1}`;
const hhmm = d => `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
const K = (d,id) => `${d}_${id}`;
const toMin = t => { const [h,m] = String(t||'0:0').split(':').map(Number); return h*60+(m||0); };
const onColor = hex => { const n = parseInt(hex.slice(1),16); const l = (0.299*(n>>16&255)+0.587*(n>>8&255)+0.114*(n&255))/255; return l > .6 ? '#1E2433' : '#fff'; };
const byName = (a,b) => (a.name||'').localeCompare(b.name||'','he');
const clone = o => JSON.parse(JSON.stringify(o));
const val = id => document.getElementById(id)?.value.trim() || '';
const newSettings = business => ({ ...clone(DEFAULT_SETTINGS), positions:[], viewsVersion:1, business, tzMin:-new Date().getTimezoneOffset(), appUrl:location.origin + location.pathname });
const genCode = () => String(100000 + (crypto.getRandomValues(new Uint32Array(1))[0] % 900000));
const store = { get(k){ try{ return localStorage.getItem(k) || ''; }catch{ return ''; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch{} } };
const genPw = () => Array.from({length:8}, () => 'abcdefghjkmnpqrstuvwxyz23456789'[Math.floor(Math.random()*31)]).join('');
const waPhone = p => { let d = String(p||'').replace(/\D/g,''); if (d.startsWith('0')) d = '972'+d.slice(1); return d; };

let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800); }
function errMsg(e){
  const c = e?.code || '';
  if (/invalid-credential|wrong-password|user-not-found/.test(c)) return 'האימייל או הסיסמה שגויים';
  if (c.includes('email-already-in-use')) return 'כבר קיים משתמש עם האימייל הזה';
  if (c.includes('weak-password')) return 'הסיסמה צריכה לכלול לפחות 6 תווים';
  if (c.includes('invalid-email')) return 'כתובת האימייל לא תקינה';
  if (c.includes('too-many-requests')) return 'יותר מדי ניסיונות. נסה שוב בעוד כמה דקות';
  if (c === 'no-company') return 'החשבון הזה לא משויך לאף עסק. אפשר לפתוח חשבון עסק, או לבקש ממנהל להוסיף אותך';
  if (c === 'inactive') return 'החשבון שלך לא פעיל באף עסק. פנה למנהל';
  if (c === 'inactive-here') return 'החשבון שלך לא פעיל בעסק הזה. פנה למנהל';
  if (c === 'legacy-wait') return 'המערכת עודכנה. בקש מבעל העסק להיכנס פעם אחת, ואז נסה שוב';
  if (c === 'exists-wrong-pw') return 'האימייל הזה כבר רשום. כדי לפתוח איתו עסק, הקלד את הסיסמה שלו';
  if (c === 'already-member') return 'העובד הזה כבר נמצא ברשימת העובדים של העסק';
  if (c === 'needs-login') return 'האימייל הזה רשום, אבל העובד צריך להיכנס למערכת פעם אחת לפני שאפשר לצרף אותו';
  if (c.includes('permission-denied')) return 'אין הרשאה לפעולה הזו';
  return e?.message || 'משהו השתבש, נסה שוב';
}
async function copyText(t){
  try { await navigator.clipboard.writeText(t); toast('הועתק'); }
  catch { prompt('העתק את הטקסט:', t); }
}

/* ---------- backend: demo ---------- */
function demoBackend(){

    m1:{ name:'דנה', email:'dana@demo' }, m2:{ name:'אורי', email:'ori@demo' },

    g1:{ name:'גלעד', email:'gilad@demo' },
  };
  const mem = (uid, role, positions, extra = {}) => ({ name:accounts[uid].name, email:accounts[uid].email, role, positions, active:true, ...extra });
  const A_ = '123456', B_ = '654321';
  const s1 = { ...clone(DEFAULT_SETTINGS), business:'מסעדת הדגמה' };
  s1.shifts.push({ id:'prep', name:'הכנות', start:'10:00', end:'16:00', color:'#2E8B7A', need:[1,1,1,1,1,0,0], positions:['cook'] });

  s2.shifts = [

/* ---------- backend: Firebase ---------- */
/* מבנה הנתונים:
   companies/{מזהה}                  העסק (ownerUid = הבעלים)
   companies/{מזהה}/members/{uid}    העובד בעסק הזה: שם, הרשאה, תפקידים, פעיל
   companies/{מזהה}/settings, weeks  ההגדרות והסידורים של העסק
   users/{uid}/companies/{מזהה}      רשימת העסקים של כל חשבון
   emails/{אימייל}                   מאיזה אימייל לאיזה חשבון, כדי לצרף עובד קיים */
async function firebaseBackend(cfg){
  const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const AppM = await import(base+'firebase-app.js');
  const A = await import(base+'firebase-auth.js');
  const F = await import(base+'firebase-firestore.js');
  const app = AppM.initializeApp(cfg), auth = A.getAuth(app), db = F.getFirestore(app);
  auth.languageCode = 'he';
  const snap = s => s.exists() ? s.data() : null;
  const now = () => F.serverTimestamp();
  let cid = null;
  const cdoc = (...p) => F.doc(db, 'companies', cid, ...p);
  const ccol = (...p) => F.collection(db, 'companies', cid, ...p);
  const memberRef = (c, u) => F.doc(db, 'companies', c, 'members', u);
  const indexRef = (u, c) => F.doc(db, 'users', u, 'companies', c);
  // אפליקציה משנית ליצירת חשבונות, כדי שהמנהל לא יתנתק. היא מחוברת לרגע כעובד החדש
  let creator = null;
  async function getCreator(){
    if (creator) return creator;
    const sec = AppM.initializeApp(cfg, 'creator');
    const ca = A.getAuth(sec);
    await A.setPersistence(ca, A.inMemoryPersistence);
    return creator = { auth:ca, db:F.getFirestore(sec) };
  }
  async function ensureEmailIndex(){
    const u = auth.currentUser; if (!u?.email) return;
    const e = u.email.toLowerCase(), r = F.doc(db, 'emails', e);
    const s = snap(await F.getDoc(r));
    if (s?.uid !== u.uid) await F.setDoc(r, { uid:u.uid });
  }
  async function createCompany({ restaurant, name, settings }){
    const u = auth.currentUser;
    let code = null;
    for (let i = 0; i < 10 && !code; i++) {
      const c = genCode();
      try { await F.setDoc(F.doc(db,'companies',c), { name:restaurant, ownerUid:u.uid, createdAt:now() }); code = c; }
      catch(e){ if (!String(e?.code).includes('permission-denied')) throw e; }  // המספר תפוס, מגרילים שוב
    }
    if (!code) throw new Error('לא הצלחנו לפתוח את העסק, נסה שוב');
    await F.setDoc(memberRef(code, u.uid), { name, email:(u.email||'').toLowerCase(), role:'owner', positions:[], active:true, joinedAt:now() });
    await F.setDoc(indexRef(u.uid, code), { name:restaurant, joinedAt:now() });
    await F.setDoc(F.doc(db,'companies',code,'settings','main'), settings);
    return code;
  }
  return {
    demo:false,
    onAuth(cb){ A.onAuthStateChanged(auth, u => cb(u ? { uid:u.uid, email:u.email } : null)); },
    setCompany(c){ cid = c; },
    async signIn(email,pw){ await A.signInWithEmailAndPassword(auth,email,pw); },
    async signOut(){ cid = null; await A.signOut(auth); },
    async sendReset(email){ await A.sendPasswordResetEmail(auth,email); },
    ensureEmailIndex,
    async signUp({ restaurant, name, email, password, settings }){
      let cred, isNew = true;
      try { cred = await A.createUserWithEmailAndPassword(auth, email, password); }
      catch(e){
        if (!String(e?.code).includes('email-already-in-use')) throw e;
        // כבר יש חשבון (למשל עובד בעסק אחר): פותחים לו עסק נוסף
        try { cred = await A.signInWithEmailAndPassword(auth, email, password); } catch { throw { code:'exists-wrong-pw' }; }
        isNew = false;
      }
      try{
        await ensureEmailIndex().catch(() => {});
        return { uid:cred.user.uid, code:await createCompany({ restaurant, name, settings }) };
      }catch(e){
        if (isNew) await A.deleteUser(cred.user).catch(() => {}); else await A.signOut(auth);
        throw e;
      }
    },
    createCompany,
    // כל העסקים של החשבון, ולכל אחד אם המשתמש עדיין פעיל בו (כל משתמש יכול לקרוא את הכרטיס של עצמו)
    async myCompanies(){
      const me = auth.currentUser.uid;
      const q = await F.getDocs(F.collection(db, 'users', me, 'companies'));
      return Promise.all(q.docs.map(async d => {
        let m = null; try { m = snap(await F.getDoc(memberRef(d.id, me))); } catch {}
        return { cid:d.id, name:d.data().name || '', active:!!m && m.active !== false };
      }));
    },
    async companyName(c){ try { return snap(await F.getDoc(F.doc(db,'companies',c,'settings','main')))?.business || null; } catch { return null; } },
    async getMember(uid){ return snap(await F.getDoc(memberRef(cid, uid))); },
    async getCompany(){ return snap(await F.getDoc(F.doc(db,'companies',cid))); },
    // שם העסק בפרטי החברה, כדי שיתאים לשם בהגדרות
    async setCompanyName(n){ await F.setDoc(F.doc(db,'companies',cid), { name:n }, { merge:true }); },
    async listUsers(){ const q = await F.getDocs(ccol('members')); return q.docs.map(d => ({ uid:d.id, ...d.data() })); },
    async addUser(data, companyName){
      const { password, ...doc } = data;
      let uid, existing = false;
      const cr = await getCreator();
      try {
        const cred = await A.createUserWithEmailAndPassword(cr.auth, doc.email, password);
        uid = cred.user.uid;
        await F.setDoc(F.doc(cr.db, 'emails', doc.email), { uid }).catch(e => console.warn(e));
        await A.signOut(cr.auth);
      } catch(e){
        if (!String(e?.code).includes('email-already-in-use')) throw e;
        // החשבון כבר קיים: מצרפים אותו לעסק, והסיסמה שלו לא משתנה
        const m = snap(await F.getDoc(F.doc(db, 'emails', doc.email)));
        if (!m?.uid) throw { code:'needs-login' };
        uid = m.uid; existing = true;
      }
      if (snap(await F.getDoc(memberRef(cid, uid)))) throw { code:'already-member' };
      const b = F.writeBatch(db);
      b.set(memberRef(cid, uid), { ...doc, active:true, joinedAt:now() });
      b.set(indexRef(uid, cid), { name:companyName || '', joinedAt:now() });
      await b.commit();
      return { uid, existing };
    },
    async updateUser(uid,data){ await F.setDoc(memberRef(cid, uid), data, { merge:true }); },
    // שלושת השינויים נשמרים יחד או לא נשמרים בכלל, כך שתמיד יש בעלים אחד
    async transferOwnership(newUid){
      const b = F.writeBatch(db);
      b.update(F.doc(db,'companies',cid), { ownerUid:newUid });
      b.update(memberRef(cid, newUid), { role:'owner' });
      b.update(memberRef(cid, auth.currentUser.uid), { role:'manager' });
      await b.commit();
    },
    // העברה חד-פעמית מהגרסה הקודמת, שבה כל משתמש היה שייך לעסק אחד (users/{uid}.companyId)
    async migrateLegacy(){
      const me = auth.currentUser;
      let p = null; try { p = snap(await F.getDoc(F.doc(db,'users',me.uid))); } catch {}
      if (!p?.companyId) return { list:[] };
      const c = p.companyId;
      try {
        await F.setDoc(memberRef(c, me.uid), { name:p.name || '', email:(p.email || me.email || '').toLowerCase(), phone:p.phone || '',
          role:'owner', positions:p.positions || [], maxShifts:p.maxShifts ?? null, active:true, joinedAt:now() });
      } catch { return { list:[], legacy:true }; }   // רק הבעלים מעביר את העסק
      const name = snap(await F.getDoc(F.doc(db,'companies',c,'settings','main')))?.business || '';
      await F.setDoc(indexRef(me.uid, c), { name, joinedAt:now() });
      const q = await F.getDocs(F.query(F.collection(db,'users'), F.where('companyId','==',c)));
      const b = F.writeBatch(db); let n = 0;
      q.docs.forEach(d => {
        if (d.id === me.uid) return;
        const u = d.data();
        b.set(memberRef(c, d.id), { name:u.name || '', email:(u.email || '').toLowerCase(), phone:u.phone || '',
          role:u.role === 'manager' ? 'manager' : 'employee', positions:u.positions || [], maxShifts:u.maxShifts ?? null,
          active:u.active !== false, joinedAt:now() });
        b.set(indexRef(d.id, c), { name, joinedAt:now() });
        n++;
      });
      if (n) await b.commit();
      return { list:[{ cid:c, name }] };
    },
    async getSettings(){ return snap(await F.getDoc(cdoc('settings','main'))); },
    async saveSettings(s){ await F.setDoc(cdoc('settings','main'), s); },
    async getWeek(id){ return snap(await F.getDoc(cdoc('weeks',id))) || {}; },
    async updateWeek(id,data){ await F.setDoc(cdoc('weeks',id), data, { mergeFields:Object.keys(data) }); },
    async getSubmission(w,uid){ return snap(await F.getDoc(cdoc('weeks',w,'submissions',uid))); },
    async saveSubmission(w,uid,data){ await F.setDoc(cdoc('weeks',w,'submissions',uid), { ...data, updatedAt:now() }); },
    async listSubmissions(w){
      const q = await F.getDocs(ccol('weeks',w,'submissions'));
      const o = {}; q.docs.forEach(d => o[d.id] = d.data()); return o;
    },
    async listWeeks(){ const q = await F.getDocs(ccol('weeks')); return q.docs.map(d => ({ id:d.id, ...d.data() })); },
    // מה שעובדים רואים: סטטוס השבוע (סגור להגשה או לא), ועותק אישי של הסידור עם המשמרות שמותר להם לראות
    async getWeekStatus(w){ return snap(await F.getDoc(cdoc('weeks',w,'status','main'))) || {}; },
    async setWeekStatus(w,data){ await F.setDoc(cdoc('weeks',w,'status','main'), data, { merge:true }); },
    async getMyView(w,uid){ return snap(await F.getDoc(cdoc('members',uid,'schedule',w))); },
    async listMySchedule(uid){ const q = await F.getDocs(ccol('members',uid,'schedule')); return q.docs.map(d => ({ id:d.id, ...d.data() })); },
    async writeViews(w, map){
      const entries = Object.entries(map);
      for (let i = 0; i < entries.length; i += 400) {
        const b = F.writeBatch(db);
        entries.slice(i, i + 400).forEach(([uid,v]) => b.set(cdoc('members',uid,'schedule',w), v));
        await b.commit();
      }
    },
  };
}

/* ---------- state ---------- */
const S = {
  ready:false, user:null, profile:null, cid:null, companies:[], sheetMode:null, authMode:'login', freshLogin:false, picking:false, pickNew:false, signingUp:false, users:[], settings:clone(DEFAULT_SETTINGS), view:null,

const ST = () => S.settings;
const MGR_ROLES = ['manager','owner'];
const ROLE_LABEL = { owner:'בעלים', manager:'מנהל', employee:'עובד' };
const isMgrRole = r => MGR_ROLES.includes(r);
const isMgr = () => isMgrRole(S.profile?.role);
const positions = () => ST().positions || [];
const posName = id => positions().find(p => p.id === id)?.name;
const userPos = u => (u?.positions || []).filter(posName);
const myTitle = () => [S.profile?.role !== 'employee' ? ROLE_LABEL[S.profile?.role] : null, ...userPos(S.profile).map(posName)].filter(Boolean).join(', ');
/* מי משתבץ: עובד רגיל תמיד, מנהל או בעלים רק אם יש לו תפקיד */
const isWorker = u => !!u && u.active !== false && (u.role === 'employee' || userPos(u).length > 0 || !!u.works);
/* האם המשמרת מתאימה לעובד: משמרת בלי תפקידים מתאימה לכולם */
/* בסידור שפורסם: מנהלים רואים הכול. עובד רואה משמרות כלליות, משמרות של התפקידים שלו,
   משמרות של תפקידים שהמנהל התיר לתפקיד שלו לראות, ומשמרות שהוא משובץ בהן */
function canSee(u, s){
  if (isMgrRole(u?.role)) return true;
  const need = (s?.positions || []).filter(posName);
  if (!need.length) return true;
  const allowed = new Set();
  userPos(u).forEach(id => { allowed.add(id); (positions().find(p => p.id === id)?.sees || []).forEach(x => allowed.add(x)); });
  return need.some(id => allowed.has(id));
}
const canWork = (u, s) => { const need = (s?.positions || []).filter(posName); return !need.length || userPos(u).some(p => need.includes(p)); };
const members = () => S.users.filter(u => u.active !== false);
const workers = () => members().filter(isWorker).sort(byName);
const nameOf = uid => S.users.find(u => u.uid===uid)?.name || 'לא ידוע';
const shiftById = id => ST().shifts.find(s => s.id === id);
const needAt = (s,d) => Math.max(0, parseInt(s?.need?.[d]) || 0);
const shiftsOn = d => ST().shifts.filter(s => needAt(s,d) > 0);
const keys = () => DAYS.flatMap((_,d) => shiftsOn(d).map(s => K(d,s.id)));
const needOf = k => { const [d,id] = k.split('_'); return needAt(shiftById(id), +d); };
const hrs = s => `${s.start}–${s.end}`;
const ltr = t => `<bdi dir="ltr">${t}</bdi>`;
const wid = () => weekId(S.weekStart);
const asg = () => {
  const src = S.week.assignments || {}, a = {};
  keys().forEach(k => a[k] = (src[k] || []).filter(uid => S.users.some(u => u.uid === uid)));
  return a;
};
const emptyAsg = () => Object.fromEntries(keys().map(k => [k, []]));
function normSettings(x){
  const s = { ...clone(DEFAULT_SETTINGS), ...(x || {}) };
  s.positions = (s.positions || []).filter(p => p && p.id);
  s.shifts = (s.shifts || []).map(sh => ({ ...sh, positions:(sh.positions || []).filter(id => s.positions.some(p => p.id === id)), need: Array.from({length:7}, (_,d) => needAt(sh,d)) }));
  return s;
}
function deadline(){
  const H = parseInt(ST().deadlineHours) || 0; if (!H) return null;
  const w = S.weekStart;
  return new Date(Date.UTC(w.getFullYear(), w.getMonth(), w.getDate()) - (parseInt(ST().tzMin)||0)*60e3 - H*3600e3);
}
const fmtDl = d => `יום ${DAYS[d.getDay()]} ${fmt(d)} בשעה ${hhmm(d)}`;
const submissionOpen = () => { const dl = deadline(); return !S.week.locked && (!dl || Date.now() < dl); };

/* שיבוץ: מה מונע מעובד לקחת משמרת */
function span(k){
  const [d,id] = k.split('_'), s = shiftById(id);
  const st = +d*1440 + toMin(s.start); let en = +d*1440 + toMin(s.end); if (en <= st) en += 1440;
  return [st,en];
}
function conflicts(u,k,a){
  const st = ST(), out = [], d = k.split('_')[0];
  const mine = Object.keys(a).filter(x => x !== k && a[x].includes(u.uid));
  if (st.onePerDay && mine.some(x => x.split('_')[0] === d)) out.push('day');
  const rest = parseInt(st.minRest) || 0;
  if (rest > 0) { const sp = span(k); if (mine.some(x => { const o = span(x); return Math.max(sp[0]-o[1], o[0]-sp[1]) < rest*60; })) out.push('rest'); }
  const max = (u.maxShifts ?? '') !== '' ? +u.maxShifts : (parseInt(st.maxPerWeek) || 0);
  if (max > 0 && mine.length >= max) out.push('max');
  return out;
}
const WARN = { day:'כבר משובץ ביום הזה', rest:'לא מספיק מנוחה', max:'הגיע למקסימום' };

function autoAssign(){
  const E = workers(), ks = keys(), a = Object.fromEntries(ks.map(k => [k, []]));
  const av = (uid,k) => S.subs[uid]?.avail?.[k];
  const ok = v => v === 'yes' || v === 'maybe';
  const supply = k => E.filter(u => canWork(u, shiftById(k.split('_')[1])) && ok(av(u.uid,k))).length / needOf(k);
  const load = u => ks.filter(k => a[k].includes(u.uid)).length;
  for (const k of [...ks].sort((x,y) => supply(x) - supply(y))) {          // קודם המשמרות שהכי קשה לאייש
    E.filter(u => canWork(u, shiftById(k.split('_')[1])) && ok(av(u.uid,k)) && !conflicts(u,k,a).length)
     .sort((x,y) => (av(x.uid,k)==='yes'?0:1) - (av(y.uid,k)==='yes'?0:1) || load(x) - load(y))
     .slice(0, needOf(k)).forEach(u => a[k].push(u.uid));
  }
  return a;
}
function scheduleText(){
  const a = asg();
  let t = `*${ST().business}: סידור עבודה ${fmt(S.weekStart)}–${fmt(addDays(S.weekStart,6))}*\n`;
  DAYS.forEach((dn,d) => {
    const sh = shiftsOn(d); if (!sh.length) return;
    t += `\n*${dn} ${fmt(addDays(S.weekStart,d))}*\n`;
    sh.forEach(s => { const n = a[K(d,s.id)]; t += `${s.name} (${hrs(s)}): ${n.length ? n.map(nameOf).join(', ') : '—'}\n`; });
  });
  if (S.week.message) t += `\n${S.week.message}\n`;
  return t;
}

async function loadWeek(){
  S.loading = true; render();

    if (isMgr()) S.week = await B.getWeek(wid());
    else {
      const [st, v] = await Promise.all([B.getWeekStatus(wid()), B.getMyView(wid(), S.user.uid)]);
      S.week = { ...st, ...(v?.published ? v : {}) };
    }
    S.msgDraft = S.week.message || '';
    if (isMgr()) { S.subs = await B.listSubmissions(wid()); if (S.view === 'user') loadDraftFor(S.editUid); }
    else {
      S.mySub = await B.getSubmission(wid(), S.user.uid);
      S.draft = { ...(S.mySub?.avail || {}) }; S.note = S.mySub?.note || ''; S.dirty = false;
    }
  }catch(e){ toast(errMsg(e)); }
  S.loading = false; render();
}
function loadDraftFor(uid){ const s = S.subs[uid]; S.draft = { ...(s?.avail || {}) }; S.note = s?.note || ''; S.dirty = false; }
async function afterLogin(){
  const fresh = S.freshLogin; S.freshLogin = false;
  B.ensureEmailIndex().catch(() => {});
  let all = await B.myCompanies();
  if (!all.length) {
    const m = await B.migrateLegacy().catch(() => ({ list:[] }));
    all = m.list.map(c => ({ ...c, active:true }));
    if (!all.length) { toast(errMsg({ code: m.legacy ? 'legacy-wait' : 'no-company' })); await B.signOut(); return; }
  }
  // עסקים שבהם סימנו את המשתמש כלא פעיל לא מופיעים בכלל
  const list = all.filter(c => c.active);
  if (!list.length) { toast(errMsg({ code:'inactive' })); await B.signOut(); return; }
  S.companies = list;
  // אחרי כניסה עם סיסמה: מי שפעיל בכמה עסקים בוחר מהרשימה
  if (fresh && list.length > 1) { S.picking = true; S.pickNew = false; render(); refreshNames(); return; }
  // פתיחה רגילה: העסק האחרון במכשיר הזה, ואם הוא לא זמין, הבא בתור
  const last = store.get('lastCompany:' + S.user.uid);
  const order = [...list].sort((a,b) => (b.cid === last) - (a.cid === last));
  for (const c of order) if (await enterCompany(c.cid)) return;
  toast(errMsg({ code:'inactive' })); await B.signOut();
}
async function refreshNames(){
  try { const fresh = await B.myCompanies(); S.companies = fresh.filter(c => c.active || c.cid === S.cid).map(c => ({ ...c, name:S.companies.find(x => x.cid === c.cid)?.name || c.name })); } catch {}
  await Promise.all(S.companies.map(async c => { const n = await B.companyName(c.cid); if (n) c.name = n; }));
  if (S.picking) render(); else if (S.sheetMode === 'switch') renderSwitch();
}
async function enterCompany(cid){
  B.setCompany(cid);
  let p = null; try { p = await B.getMember(S.user.uid); } catch {}
  if (!p || p.active === false) { if (S.cid) B.setCompany(S.cid); return false; }
  S.cid = cid; S.profile = { ...p, uid:S.user.uid };
  store.set('lastCompany:' + S.user.uid, cid);
  S.settings = normSettings(await B.getSettings());
  S.users = await B.listUsers();
  Object.assign(S, { subs:{}, week:{}, allWeeks:null, repUid:null, editUid:null, draft:{}, note:'', dirty:false, sDirty:false, mySub:null });
  const c = S.companies.find(x => x.cid === cid); if (c) c.name = ST().business;
  S.view = isMgr() ? 'manage' : 'submit';
  if (isMgr()) B.getCompany().then(c => { if (c && c.name !== ST().business) return B.setCompanyName(ST().business); }).catch(e => console.warn(e));
  if (isMgr() && !ST().viewsVersion) {
    resyncPublished(true).then(async () => {
      const st = { ...clone(S.settings), viewsVersion:1 };
      const status = (await B.listWeeks()).filter(w => w.locked);
      for (const w of status) await B.setWeekStatus(w.id, { locked:true });
      await B.saveSettings(st); S.settings = normSettings(st);
    }).catch(e => console.warn(e));
  }
  await loadWeek();
  return true;
}

/* ---------- hours reports ---------- */
const PERIODS = [['month','החודש'],['prev','החודש הקודם'],['year','השנה'],['all','כל הזמן']];
const monthName = d => new Intl.DateTimeFormat('he', { month:'long', year:'numeric' }).format(d);
const fmtH = h => String(Math.round(h*100)/100);
function periodRange(p){
  const n = new Date(), y = n.getFullYear(), m = n.getMonth();
  if (p === 'month') return [new Date(y,m,1), new Date(y,m+1,1)];
  if (p === 'prev')  return [new Date(y,m-1,1), new Date(y,m,1)];
  if (p === 'year')  return [new Date(y,0,1), new Date(y+1,0,1)];
  return [new Date(0), new Date(8.64e15)];
}
function periodTitle(p){
  const n = new Date();
  if (p === 'month') return monthName(n);
  if (p === 'prev') return monthName(new Date(n.getFullYear(), n.getMonth()-1, 1));
  if (p === 'year') return `שנת ${n.getFullYear()}`;
  return 'כל הזמן';
}
async function loadReports(){
  S.allWeeks = null; render();
  try{ S.allWeeks = isMgr() ? await B.listWeeks() : await B.listMySchedule(S.user.uid); }catch(e){ toast(errMsg(e)); S.allWeeks = []; }
  render();
}
/* כל משמרת שובצה בסידור שפורסם = רשומה. שעות לפי הגדרות המשמרת ביום הפרסום */
function entries(){
  const out = [];
  for (const w of S.allWeeks || []) {
    if (!w.published) continue;
    const [y,m,d0] = w.id.split('-').map(Number);
    for (const [k,uids] of Object.entries(w.assignments || {})) {
      const [d,id] = k.split('_'), s = w.shiftsSnap?.[id] || shiftById(id);
      if (!s || !uids?.length) continue;
      const st = toMin(s.start); let en = toMin(s.end); if (en <= st) en += 1440;
      const start = new Date(y, m-1, d0 + +d, 0, st), end = new Date(y, m-1, d0 + +d, 0, en);
      for (const uid of uids) out.push({ uid, start, end, hours:(en-st)/60, name:s.name, color:s.color || '#8A94A6' });
    }
  }
  return out.sort((a,b) => a.start - b.start);
}
function inPeriod(list){ const [a,b] = periodRange(S.rep); return list.filter(e => e.start >= a && e.start < b); }
function sums(list){
  const now = Date.now(), done = list.filter(e => e.end <= now), next = list.filter(e => e.end > now);
  return { n:done.length, h:done.reduce((t,e) => t+e.hours, 0), fn:next.length, fh:next.reduce((t,e) => t+e.hours, 0) };
}
const periodPicker = () => `<div class="seg">${PERIODS.map(([p,l]) => `<button data-action="period" data-p="${p}" aria-pressed="${S.rep===p}">${l}</button>`).join('')}</div>`;
function statCards(list){
  const t = sums(list);
  return `<div class="cards">
    <div class="stat"><b>${fmtH(t.h)}</b><span>${isMgr() ? 'שעות שבוצעו' : 'שעות שעבדת'}</span></div>
    <div class="stat"><b>${t.n}</b><span>משמרות</span></div>
    ${t.fn ? `<div class="stat"><b>${fmtH(t.fh)}</b><span>שעות מתוכננות (${t.fn} משמרות)</span></div>` : ''}
  </div>`;
}
function entryList(list){
  if (!list.length) return `<p class="empty">אין משמרות בתקופה הזו.</p>`;
  const now = Date.now(); let lastM = '', html = '';
  const multi = S.rep === 'year' || S.rep === 'all';
  for (const e of [...list].reverse()) {
    const mn = monthName(e.start);
    if (multi && mn !== lastM) { if (lastM) html += '</ul>'; html += `<p class="month">${mn}</p><ul class="list">`; lastM = mn; }
    else if (!html) html = '<ul class="list">';
    html += `<li><span class="myshift"><i class="dot" style="--c:${e.color}"></i><span>יום ${DAYS[e.start.getDay()]} ${fmt(e.start)}<span class="sub" style="display:block">${esc(e.name)}, ${ltr(`${hhmm(e.start)}–${hhmm(e.end)}`)}</span></span></span>
      <span>${fmtH(e.hours)} ש׳${e.end > now ? '<span class="tag">מתוכנן</span>' : ''}</span></li>`;
  }
  return html + '</ul>';
}
const repNote = `<p class="hint">הדוח מחושב לפי הסידורים שפורסמו, לא לפי שעון נוכחות.</p>`;
function viewHours(){
  if (!S.allWeeks) return `<p class="loading">טוען…</p>`;
  const list = inPeriod(entries()).filter(e => e.uid === S.user.uid);
  return `${periodPicker()}<h3 style="margin-top:6px">${periodTitle(S.rep)}</h3>${statCards(list)}
    <div class="toolbar"><button class="btn sm" data-action="csv">הורדה כקובץ אקסל (CSV)</button></div>${entryList(list)}${repNote}`;
}
function viewReports(){
  if (!S.allWeeks) return `<p class="loading">טוען…</p>`;
  const all = inPeriod(entries());
  if (S.repUid) {
    const list = all.filter(e => e.uid === S.repUid);
    return `${periodPicker()}<div class="toolbar"><button class="btn sm" data-action="repBack">חזרה לכל העובדים</button></div>
      <h3 style="margin-top:6px">${esc(nameOf(S.repUid))}, ${periodTitle(S.rep)}</h3>${statCards(list)}
      <div class="toolbar"><button class="btn sm" data-action="csv">הורדה כקובץ אקסל (CSV)</button></div>${entryList(list)}${repNote}`;
  }
  const ids = new Set([...workers().map(u => u.uid), ...all.map(e => e.uid)]);
  const rows = [...ids].map(uid => ({ uid, ...sums(all.filter(e => e.uid === uid)) })).sort((a,b) => b.h - a.h || nameOf(a.uid).localeCompare(nameOf(b.uid),'he'));
  const tot = sums(all);
  return `${periodPicker()}<h3 style="margin-top:6px">${periodTitle(S.rep)}</h3>
    <div class="cards"><div class="stat"><b>${fmtH(tot.h)}</b><span>שעות בסך הכול</span></div><div class="stat"><b>${tot.n}</b><span>משמרות שבוצעו</span></div>
      ${tot.fn ? `<div class="stat"><b>${fmtH(tot.fh)}</b><span>שעות מתוכננות</span></div>` : ''}</div>
    <div class="toolbar"><button class="btn sm" data-action="csv">הורדת דוח מפורט (CSV)</button><button class="btn sm" data-action="refreshRep">רענון</button></div>
    <ul class="list">${rows.map(r => `<li class="btnrow"><button class="userbtn" data-action="repUser" data-uid="${r.uid}">
      <span><b>${esc(nameOf(r.uid))}</b><span class="sub" style="display:block">${r.n} משמרות${r.fn ? `, עוד ${r.fn} מתוכננות` : ''}</span></span>
      <span><b>${fmtH(r.h)}</b> שעות</span></button></li>`).join('')}</ul>${repNote}`;

function downloadCsv(){
  let list = inPeriod(entries());
  const uid = isMgr() ? S.repUid : S.user.uid;
  if (uid) list = list.filter(e => e.uid === uid);
  const rows = [['עובד','תאריך','יום','משמרת','התחלה','סיום','שעות','סטטוס']];
  const now = Date.now();
  list.forEach(e => rows.push([nameOf(e.uid), `${e.start.getDate()}/${e.start.getMonth()+1}/${e.start.getFullYear()}`, DAYS[e.start.getDay()],
    e.name, hhmm(e.start), hhmm(e.end), fmtH(e.hours), e.end > now ? 'מתוכנן' : 'בוצע']));
  const csv = '\uFEFF' + rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' }));
  a.download = `דוח-שעות-${uid ? nameOf(uid) + '-' : ''}${periodTitle(S.rep)}.csv`.replace(/\s+/g,'-');
  document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- slot sheet ---------- */
function renderSheet(){
  const k = S.openKey; if (!k) return;
  const [d,id] = k.split('_'), s = shiftById(id), a = asg(), on = new Set(a[k]);
  const count = uid => keys().filter(x => a[x].includes(uid)).length;
  const groups = [['yes','יכולים'],['maybe','מעדיפים שלא'],['unset','לא סימנו'],['no','לא יכולים']];
  const rows = workers().filter(u => on.has(u.uid) || canWork(u,s)).map(u => ({ u, v: S.subs[u.uid]?.avail?.[k] || 'unset', w: on.has(u.uid) ? [] : conflicts(u,k,a) }));
  const sp = (s.positions || []).map(posName).filter(Boolean);
  $sheet.innerHTML = `<div class="sheet" style="--c:${s.color}">
    <header><div><h2>${esc(s.name)}, יום ${DAYS[d]} ${fmt(addDays(S.weekStart,+d))}</h2>
      <div class="hint" style="margin:0">${ltr(hrs(s))}. משובצים ${on.size} מתוך ${needOf(k)}${sp.length ? `. מתאימה ל${sp.join(' ול')}` : ''}</div></div>
      <button class="iconbtn" data-action="closeSheet" aria-label="סגירה">✕</button></header>
    ${groups.map(([g,title]) => { const list = rows.filter(r => r.v === g); if (!list.length) return '';
      return `<h4>${title}</h4>${list.map(({u,w}) => `<label class="opt">
        <input type="checkbox" data-assign="${u.uid}" ${on.has(u.uid)?'checked':''}>
        <span>${esc(u.name)}<span class="sub" style="display:block">${userPos(u).map(posName).join(', ')}</span></span>
        <span class="meta">${count(u.uid)} משמרות${w.map(x => `<span class="w">${WARN[x]}</span>`).join('')}</span></label>`).join('')}`; }).join('')}
    ${!rows.length ? `<p class="hint">${sp.length ? 'אין עובדים עם התפקיד שמתאים למשמרת הזו.' : 'אין עובדים פעילים. מוסיפים עובדים בלשונית "עובדים".'}</p>` : ''}
  </div>`;
}

function confirmLeave(){
  if ((S.dirty || S.sDirty) && !confirm('יש שינויים שלא נשמרו. להמשיך בלי לשמור?')) return false;
  S.dirty = false; S.sDirty = false; return true;
}
/* העותק של כל עובד: רק משמרות שהוא רשאי לראות (לפי ההגדרות), ותמיד משמרות שהוא משובץ בהן */
function viewFor(u, w){
  if (!w.published) return { published:false };
  const ids = new Set(), all = w.assignments || {};
  Object.keys(all).forEach(k => {
    const id = k.split('_')[1], s = shiftById(id) || { id, positions:[] };
    if (canSee(u, s) || (all[k] || []).includes(u.uid)) ids.add(id);
  });
  const assignments = {}, shiftsSnap = {};
  Object.entries(all).forEach(([k,v]) => { if (ids.has(k.split('_')[1])) assignments[k] = v; });
  ids.forEach(id => { const sn = w.shiftsSnap?.[id]; if (sn) shiftsSnap[id] = sn; });
  return { published:true, message:w.message || '', assignments, shiftsSnap };
}
async function syncViews(weekIdv, w){
  const map = {};
  S.users.forEach(u => { map[u.uid] = viewFor(u, w); });
  await B.writeViews(weekIdv, map);
}
/* אחרי שינוי בהגדרות או בעובדים: מעדכנים את העותקים של הסידורים שפורסמו (מהשבוע הנוכחי והלאה, או את כולם) */
async function resyncPublished(all = false){
  const from = weekId(sundayOf(new Date()));
  const weeks = (await B.listWeeks()).filter(w => w.published && (all || w.id >= from));
  for (const w of weeks) await syncViews(w.id, w);
}
async function saveWeek(patch, msg){
  try{
    await B.updateWeek(wid(), patch); S.week = { ...S.week, ...patch }; S.allWeeks = null;
    if ('locked' in patch) await B.setWeekStatus(wid(), { locked:!!patch.locked });
    if (S.week.published || patch.published === false) await syncViews(wid(), S.week);
    if (msg) toast(msg);
  }
  catch(e){ toast(errMsg(e)); }
  render();
}

    if (new Set(st.positions.map(p => p.name)).size !== st.positions.length) return toast('יש שני תפקידים עם אותו שם');
    for (const s of st.shifts) {
      s.positions = (s.positions || []).filter(id => st.positions.some(p => p.id === id));
      s.name = (s.name||'').trim();
      if (!s.name) return toast('לכל משמרת צריך שם');
      if (!s.start || !s.end) return toast(`צריך שעת התחלה וסיום למשמרת "${s.name}"`);
      s.need = Array.from({length:7}, (_,d) => needAt(s,d));
    }
    st.business = (st.business||'').trim() || 'משמרות';
    st.minRest = Math.max(0, parseInt(st.minRest) || 0);
    st.maxPerWeek = Math.max(0, parseInt(st.maxPerWeek) || 0);
    st.deadlineHours = Math.max(0, parseInt(st.deadlineHours) || 0);
    st.tzMin = -new Date().getTimezoneOffset();
    st.appUrl = location.origin + location.pathname;
    el.disabled = true;
    try{ await B.saveSettings(st); await B.setCompanyName(st.business); S.settings = normSettings(st); S.sDraft = clone(S.settings); S.sDirty = false; toast('ההגדרות נשמרו'); resyncPublished().catch(e => console.warn(e)); }
    catch(e){ toast(errMsg(e)); }
    render();
  },
};

/* ---------- events ---------- */
function setPath(obj, path, v){ const p = path.split('.'); let o = obj; for (let i = 0; i < p.length-1; i++) o = o[p[i]]; o[p.at(-1)] = v; }
const readInput = t => t.type === 'checkbox' ? t.checked : t.value;

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (el && actions[el.dataset.action]) actions[el.dataset.action](el);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.s != null) {
    setPath(S.sDraft, t.dataset.s, readInput(t));
    if (!S.sDirty) { S.sDirty = true; const sp = document.querySelector('.savebar span'); if (sp) { sp.className = 'dirty'; sp.textContent = 'יש שינויים שלא נשמרו'; } }
    if (t.type === 'checkbox') render();
  }
  else if (t.dataset.u != null) S.uDraft[t.dataset.u] = readInput(t);
  else if (t.id === 'weekMsg') S.msgDraft = t.value;
  else if (t.id === 'note') {
    S.note = t.value;
    if (!S.dirty) { S.dirty = true; const sp = document.querySelector('.savebar span'); if (sp) { sp.className = 'dirty'; sp.textContent = 'יש שינויים שלא נשמרו'; } }
  }
});
document.addEventListener('change', e => {
  if (e.target.dataset.s?.startsWith('positions.')) { render(); return; }  // שם תפקיד חדש מופיע מיד גם במשמרות
  if (!e.target.dataset.dl) return;
  const day = +document.querySelector('[data-dl="day"]').value, hour = +document.querySelector('[data-dl="hour"]').value;
  S.sDraft.deadlineHours = day < 0 ? 0 : 168 - (day*24 + hour);
  S.sDirty = true; render();
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('.login input')) document.querySelector('.login .btn.primary')?.click(); });
$sheet.addEventListener('change', async e => {
  const uid = e.target.dataset.assign; if (!uid) return;
  const a = asg(), k = S.openKey;
  a[k] = e.target.checked ? [...a[k], uid] : a[k].filter(x => x !== uid);
  await saveWeek({ assignments:a });
  renderSheet();
});
$sheet.addEventListener('close', () => { S.openKey = null; S.sheetMode = null; });
$sheet.addEventListener('click', e => { if (e.target === $sheet) $sheet.close(); });

/* ---------- boot ---------- */
(async () => {
  render();
  try{ B = FIREBASE_CONFIG.apiKey ? await firebaseBackend(FIREBASE_CONFIG) : demoBackend(); }
  catch(e){ console.error(e); B = demoBackend(); toast('החיבור ל-Firebase נכשל, עובר למצב הדגמה'); }
  B.onAuth(async u => {
    S.user = u; S.ready = true;
    if (S.signingUp) return;  // ההרשמה ממשיכה בעצמה
    if (u) { try{ await afterLogin(); }catch(e){ toast(errMsg(e)); render(); } }
    else { S.profile = null; S.cid = null; S.dirty = false; S.sDirty = false; render(); }
  });
})();
</script>
</body>
</html>
